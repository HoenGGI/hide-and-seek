<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<title>환켓몬스터</title>
<!-- exes built before the rename only accept updates containing this old title tag: <title>들풀 동행기</title> -->
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Nanum+Gothic+Coding:wght@700&display=swap">
<style>
/* layout: one 4:3 game screen centered; touch pad under it on phones. Deliberately single dark theme (arcade screen). */
:root{
  --bg:#07060b; --fg:#f4f1ff; --dim:#8a84a3; --accent:#ffe14d; --pad:#1b1826; --pad-line:#3a3550;
  --mono:"Nanum Gothic Coding","D2Coding",Consolas,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--mono);display:flex;flex-direction:column;align-items:center;gap:12px;
  padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box;margin:0}
:root{--reserve:72px}
body{justify-content:center}
#game{width:min(100%,calc((100vh - var(--reserve))*4/3));width:min(100%,calc((100dvh - var(--reserve))*4/3));aspect-ratio:4/3;image-rendering:pixelated;background:#000;display:block;touch-action:none}
@media (pointer:coarse){:root{--reserve:260px}}
@media (pointer:coarse) and (orientation:landscape){
  :root{--reserve:24px}
  .hint{display:none}
  .pad{position:fixed;left:0;right:0;bottom:max(12px,env(safe-area-inset-bottom,0px));max-width:none;
    padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));box-sizing:border-box;pointer-events:none}
  .pad>*{pointer-events:auto;opacity:.8}
}
.hint{color:var(--dim);font-size:13px;text-align:center;margin:0}
.pad{display:none;width:100%;max-width:640px;justify-content:space-between;align-items:center;gap:16px;user-select:none;-webkit-user-select:none}
@media (pointer:coarse){.pad{display:flex}.hint{display:none}}
.dpad{display:grid;grid-template-columns:repeat(3,56px);grid-template-rows:repeat(3,56px);gap:4px}
.pad button{background:var(--pad);color:var(--fg);border:2px solid var(--pad-line);border-radius:10px;font:inherit;font-size:18px;touch-action:none}
.pad button.on{background:var(--pad-line)}
.ab{display:flex;gap:12px}
.ab button{width:72px;height:72px;border-radius:50%}
button:focus-visible{outline:2px solid var(--accent)}
:root{--panel:#f8f8f0;--ink:#303848;--frame:#2c3c50;--frame2:#78a8d0}
.form{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:10;width:min(380px,calc(100% - 32px));box-sizing:border-box;
  background:var(--panel);color:var(--ink);border:4px solid var(--frame);outline:3px solid var(--frame2);outline-offset:-8px;border-radius:14px;
  padding:20px 22px;display:flex;flex-direction:column;gap:14px;font-family:var(--mono)}
.form[hidden]{display:none}
.form p{margin:0;font-size:18px;color:#2f62b8}
#form-fields{display:flex;flex-direction:column;gap:12px}
.form label{display:flex;flex-direction:column;gap:6px;font-size:14px}
.form input{font:inherit;font-size:18px;padding:8px 10px;border:2px solid var(--frame2);border-radius:8px;background:#fff;color:var(--ink);min-width:0}
.form input:focus-visible{outline:2px solid var(--frame);outline-offset:1px}
.form-row{display:flex;gap:10px;justify-content:flex-end}
.form-row button{font:inherit;font-size:16px;padding:8px 16px;border-radius:8px;border:2px solid var(--frame);background:var(--frame);color:var(--panel);cursor:pointer}
.form-row button[type=button]{background:transparent;color:var(--ink)}
.form-row button[hidden]{display:none}
</style>

<canvas id="game" width="640" height="480" aria-label="환켓몬스터 게임 화면"></canvas>
<form id="netform" class="form" hidden><p id="form-title"></p><div id="form-fields"></div>
  <div class="form-row"><button type="submit" id="form-ok">확인</button><button type="button" id="form-cancel">취소</button></div></form>
<p class="hint">방향키: 이동 · Z / Enter: 결정·조사 · X / Shift: 취소 · C / Esc: 메뉴 · M: 음악 켜기/끄기</p>
<div class="pad">
  <div class="dpad">
    <button data-k="menu" aria-label="메뉴">C</button><button data-k="up" aria-label="위">▲</button><span></span>
    <button data-k="left" aria-label="왼쪽">◀</button><button data-k="mute" aria-label="음악 끄기/켜기">♪</button><button data-k="right" aria-label="오른쪽">▶</button>
    <span></span><button data-k="down" aria-label="아래">▼</button><span></span>
  </div>
  <div class="ab"><button data-k="back" aria-label="취소">X</button><button data-k="ok" aria-label="결정">Z</button></div>
</div>

<script>
const cv=document.getElementById('game');
const ctx=cv.getContext('2d');
const W=640,H=480,TS=16;
const FONT='"Nanum Gothic Coding","D2Coding",Consolas,monospace';
const DIRS={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};
const OPP={up:'down',down:'up',left:'right',right:'left'};
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
// Korean particle by final consonant: jo('서진','이','가') -> '서진이'
const jo=(w,a,b)=>{const c=w.charCodeAt(w.length-1)-0xAC00;return w+(c>=0&&c<11172&&c%28?a:b)};

// ---------- input ----------
const held={},pressed=new Set();
const KEYS={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',z:'ok',Z:'ok',Enter:'ok',' ':'ok',x:'back',X:'back',Shift:'back',m:'mute',M:'mute',c:'menu',C:'menu',Escape:'menu'};
function press(k){initAudio();if(k==='mute'){SET.music=!SET.music;saveSettings();return}if(!held[k])pressed.add(k);held[k]=true}
function release(k){held[k]=false}
addEventListener('keydown',e=>{if(e.target.closest&&e.target.closest('#netform'))return;const k=KEYS[e.key];if(!k)return;e.preventDefault();if(!e.repeat)press(k)});
addEventListener('keyup',e=>{const k=KEYS[e.key];if(k)release(k)});
document.querySelectorAll('.pad button').forEach(b=>{
  const k=b.dataset.k;
  b.addEventListener('pointerdown',e=>{e.preventDefault();press(k);b.classList.add('on')});
  for(const ev of ['pointerup','pointerleave','pointercancel'])b.addEventListener(ev,()=>{release(k);b.classList.remove('on')});
});
cv.addEventListener('pointerdown',()=>press('ok'));
cv.addEventListener('pointerup',()=>release('ok'));
const hit=k=>pressed.has(k);

// ---------- sound ----------
let ac=null;
const SETTINGS_KEY='deulpul-settings-v1';
const SET={music:true,sfx:true};
try{Object.assign(SET,JSON.parse(localStorage.getItem(SETTINGS_KEY))||{})}catch(e){}
function saveSettings(){try{localStorage.setItem(SETTINGS_KEY,JSON.stringify(SET))}catch(e){}}
// a small Game Boy style sound chip: two pulse channels (12.5/25/50% duty), a 4-bit wave channel for bass,
// and an LFSR noise channel. No reverb: the handheld had none, and the dry sound is most of the charm.
let master=null,PW=null,WV=null,NZ=null,NZ7=null,holdUntil=0;
function initAudio(){
  if(ac)return;
  try{
    ac=new (window.AudioContext||window.webkitAudioContext)();
    master=ac.createGain();master.gain.value=0.9;const lp=ac.createBiquadFilter();lp.type='lowpass';lp.frequency.value=10000;master.connect(lp).connect(ac.destination);
    const wave=(n,f)=>{const re=new Float32Array(n),im=new Float32Array(n);for(let k=1;k<n;k++){const [x,y]=f(k);re[k]=x;im[k]=y}return ac.createPeriodicWave(re,im)};
    PW={};for(const d of [0.125,0.25,0.5])PW[d]=wave(48,k=>[2/(k*Math.PI)*Math.sin(Math.PI*k*d),0]);
    const S=[...Array(32)].map((_,i)=>Math.round(15*(i<16?i/15:(31-i)/15))/7.5-1); // stepped triangle, as in wave RAM
    WV=wave(32,k=>{let x=0,y=0;S.forEach((v,i)=>{x+=v*Math.cos(2*Math.PI*k*i/32);y+=v*Math.sin(2*Math.PI*k*i/32)});return [x/16,y/16]});
    const lfsr=short=>{const len=ac.sampleRate,buf=ac.createBuffer(1,len,ac.sampleRate),d=buf.getChannelData(0),st=ac.sampleRate/32768;let r=0x7fff,v=1,acc=0;
      for(let i=0;i<len;i++){acc+=1;while(acc>=st){acc-=st;const x=(r^(r>>1))&1;r=(r>>1)|(x<<14);if(short)r=(r&~0x40)|(x<<6);v=r&1?-1:1}d[i]=v}return buf};
    NZ=lfsr(false);NZ7=lfsr(true);
  }catch(e){ac=null}
}
// one note on a pulse ('p') or the wave channel ('w'): hard attack, the handheld's stepping-down envelope, late vibrato on long notes
function voice(kind,f,t,d,v,o={}){
  const osc=ac.createOscillator(),g=ac.createGain();
  osc.setPeriodicWave(kind==='w'?WV:PW[o.duty||0.5]);osc.frequency.setValueAtTime(f,t);
  if(o.to)osc.frequency.exponentialRampToValueAtTime(o.to,t+(o.toT||d));
  if(o.vib&&d>0.25){const l=ac.createOscillator(),lg=ac.createGain();l.frequency.value=6;lg.gain.setValueAtTime(0,t);lg.gain.setValueAtTime(0,t+0.18);lg.gain.linearRampToValueAtTime(o.vib,t+0.32);l.connect(lg).connect(osc.detune);l.start(t);l.stop(t+d+0.04)}
  const sus=o.sus??0.6;
  g.gain.setValueAtTime(v,t);g.gain.linearRampToValueAtTime(v*sus,t+Math.min(d*0.8,0.35));g.gain.linearRampToValueAtTime(0.0001,t+d+0.015);
  osc.connect(g).connect(master);osc.start(t);osc.stop(t+d+0.04);
}
function noise(t,d,v,rate,o={}){
  const s=ac.createBufferSource(),g=ac.createGain();s.buffer=o.short?NZ7:NZ;s.loop=true;s.playbackRate.setValueAtTime(rate,t);
  if(o.to)s.playbackRate.exponentialRampToValueAtTime(o.to,t+d);
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(0.0001,t+d);s.connect(g).connect(master);s.start(t,Math.random()*0.5);s.stop(t+d+0.02);
}
const sP=(f,d,v,o={})=>{if(ac&&SET.sfx)voice('p',f,ac.currentTime+(o.at||0),d,v,o)};
const sN=(d,v,rate,o={})=>{if(ac&&SET.sfx)noise(ac.currentTime+(o.at||0),d,v,rate,o)};
const SFX={
  blip:()=>sP(1568,0.025,0.03,{sus:1}),low:()=>sP(392,0.05,0.05,{sus:1}),high:()=>sP(1760,0.035,0.035,{sus:1}),
  move:()=>sP(1975,0.03,0.04,{sus:1}),ok:()=>{sP(1318,0.035,0.045,{sus:1});sP(1975,0.05,0.045,{at:0.035})},
  back:()=>{sP(1318,0.035,0.04,{sus:1});sP(880,0.05,0.04,{at:0.035})},
  no:()=>sP(123,0.16,0.06,{sus:1}),bump:()=>{sP(98,0.08,0.07);sN(0.05,0.05,0.12)},
  hit:()=>{sN(0.2,0.12,0.4,{to:0.1});sP(220,0.12,0.05,{to:70})},big:()=>{sN(0.35,0.15,0.6,{to:0.07});sP(196,0.22,0.06,{to:45})},
  weak:()=>sN(0.1,0.08,1.1,{to:0.5}),
  heal:()=>[523,659,784,1046].forEach((f,i)=>sP(f,0.08,0.045,{duty:0.25,at:i*0.06})),
  alert:()=>{sP(988,0.05,0.05,{sus:1});sP(1318,0.14,0.05,{at:0.05})},
  throw:()=>sP(1800,0.32,0.04,{duty:0.125,to:420}),wob:()=>{sP(294,0.05,0.05);sN(0.04,0.05,0.5)},
  pop:()=>{sN(0.25,0.09,0.25,{to:1.4});sP(440,0.22,0.04,{duty:0.25,to:1320})},faint:()=>sP(784,0.75,0.06,{to:80}),
  enc:()=>{sN(0.55,0.07,0.2,{to:2.2});sP(330,0.5,0.04,{duty:0.25,to:1760})},jump:()=>sP(262,0.18,0.05,{to:880}),
  danger:()=>{sP(1975,0.07,0.032,{sus:1});sP(1661,0.07,0.032,{sus:1,at:0.12})},
  shine:()=>[0,1,2,3,4].forEach(i=>sP(2093+i*330,0.05,0.03,{duty:0.125,at:i*0.05})),
  burn:()=>sN(0.4,0.1,0.7,{to:0.15}),psn:()=>[0,1,2].forEach(i=>sP(311+i*93,0.07,0.04,{duty:0.25,at:i*0.08,to:220})),
  par:()=>sN(0.28,0.07,1.6,{short:true,to:0.5}),slp:()=>sP(659,0.6,0.04,{duty:0.25,to:330}),
  stat:()=>sP(392,0.32,0.045,{to:1568}),statDown:()=>sP(1397,0.32,0.045,{to:294}),
};
// short fanfares: level up, item found, companion caught. Like the handheld, the background music pauses for them.
const FAN={lvl:['E5','G5','C6','E6'],item:['C5','E5','G5','E5','G5','C6'],catch:['C5','G5','E5','C6','G5','C6']};
function jingle(ns,st=0.13){
  if(!ac)return;const t=ac.currentTime+0.02;holdUntil=t+ns.length*st+st*1.6;
  ns.forEach((n,i)=>{voice('p',freq(n),t+i*st,st*(i===ns.length-1?2.2:1.1),0.055,{duty:0.5,sus:0.8});voice('p',freq(n)/2,t+i*st,st*1.1,0.03,{duty:0.125})});
}
// every species gets its own cry from its id: a pulse that rises, wavers and falls, roughened by noise
function cry(sp,faint){
  if(!ac||!SET.sfx)return;let h=7;for(const ch of sp)h=(h*31+ch.charCodeAt(0))>>>0;
  const t=ac.currentTime,k=faint?1.5:1,len=(0.42+(h>>5)%4*0.09)*k,f1=(320+h%480)*(faint?0.7:1),f2=f1*(1.12+((h>>3)%6)*0.09),f3=f1*(faint?0.4:0.62+((h>>9)%4)*0.1);
  const o=ac.createOscillator(),g=ac.createGain(),l=ac.createOscillator(),lg=ac.createGain();
  o.setPeriodicWave(PW[[0.125,0.25,0.5][h%3]]);
  o.frequency.setValueAtTime(f1,t);o.frequency.linearRampToValueAtTime(f2,t+len*0.28);o.frequency.setValueAtTime(f2,t+len*0.5);o.frequency.linearRampToValueAtTime(f3,t+len);
  l.frequency.value=16+h%18;lg.gain.value=35+(h>>11)%40;l.connect(lg).connect(o.detune);
  g.gain.setValueAtTime(0.06,t);g.gain.setValueAtTime(0.05,t+len*0.5);g.gain.linearRampToValueAtTime(0.0001,t+len);
  o.connect(g).connect(master);o.start(t);o.stop(t+len+0.02);l.start(t);l.stop(t+len+0.02);
  noise(t,len*0.8,0.035,0.25+(h>>13)%5*0.12,{to:0.1+(h>>15)%3*0.1,short:h%4===0});
}

  victory:{bpm:140,div:4,harmOct:4,chords:'C F Am G',
    lead:'C5 - - - E5 - - - G5 - - - E5 - G5 -  A5 - - - G5 - - - E5 - - - C5 - D5 -  E5 - - - D5 - - - C5 - - - A4 - B4 -  B4 - - - G4 - - - D5 - - - B4 - - -',
    bassPat:'R . 5 . R . 5 . R . 5 . R . 5 .',harmPat:'3 . 5 . 3 . 5 . 3 . 5 . 3 . 5 .',drum:'k . h . s . h . k . h . s . h .'},
  evolve:{bpm:96,wave:'triangle',
    lead:'C5 - D5 - E5 - G5 -  F5 - E5 - D5 - - -  E5 - F5 - G5 - A5 -  G5 - - - - - . .  A5 - G5 - F5 - E5 -  F5 - E5 - D5 - C5 -  D5 - E5 - F5 - G5 -  G5 - - - - - . .',

    arp:'C4 G4 E5 G4 C4 G4 E5 G4  D4 A4 F5 A4 D4 A4 F5 A4  E4 B4 G5 B4 E4 B4 G5 B4  F4 C5 A5 C5 G4 D5 B5 D5'},
  forest:{bpm:92,wave:'triangle',
    lead:'D5 - - - F5 - E5 -  D5 - C5 - A4 - - -  C5 - D5 - E5 - G5 -  F5 - E5 - D5 - - -  A4 - C5 - D5 - F5 -  E5 - - - C5 - A4 -  B4 - C5 - D5 - E5 -  D5 - - - - - . .',

    lead:'C5 - A4 - C5 - F5 -  E5 - D5 - C5 - - -  Bb4 - C5 - D5 - Bb4 -  A4 - - - - - . .  C5 - F5 - A5 - G5 -  F5 - E5 - D5 - - -  E5 - F5 - G5 - E5 -  F5 - - - - - . .',
    bass:'F2 . C3 . F2 . C3 .  A2 . E3 . A2 . E3 .  Bb2 . F3 . Bb2 . F3 .  C3 . G2 . C3 . E3 .  F2 . C3 . F2 . C3 .  D2 . A2 . D2 . A2 .  C3 . G2 . C3 . G2 .  F2 . C3 . F2 . . .',
    arp:'F4 A4 C5 A4 F4 A4 C5 A4  A3 C4 E4 C4 A3 C4 E4 C4  Bb3 D4 F4 D4 Bb3 D4 F4 D4  C4 E4 G4 E4 C4 E4 G4 E4',drum:'k . . h s . . h'},
  cave:{bpm:76,wave:'triangle',
    lead:'E5 - - - - - B4 -  C5 - - - B4 - - -  G4 - - - A4 - B4 -  E4 - - - - - . .  G5 - - - F#5 - E5 -  D#5 - - - - - B4 -  C5 - B4 - A4 - G4 -  F#4 - - - - - . .',
    bass:'E2 - - - - - - -  C2 - - - - - - -  A1 - - - - - - -  B1 - - - - - - -',
    arp:'E3 . B3 . G3 . B3 .  C3 . G3 . E3 . G3 .  A2 . E3 . C3 . E3 .  B2 . F#3 . D#3 . F#3 .'},
  spotted:{bpm:150,div:4,harmOct:4,chords:'E B E B',
    lead:'B4 - E5 - G#5 - B5 - A5 - G#5 - F#5 - E5 -  F#5 - - - D#5 - - - B4 - - - - - . .  B4 - E5 - G#5 - B5 - C#6 - B5 - A5 - G#5 -  A5 - - - F#5 - - - G#5 - - - - - . .',
    bassPat:'R R 8 R R R 8 R R R 8 R R R 8 R',harmPat:'. 3 . 5 . 3 . 5 . 3 . 5 . 3 . 5',drum:'k h s h k h s h k h s h k h s s'},
  title:{bpm:128,div:4,chords:'C G C Dm F C Dm G',
    lead:'C5 - - - - - G4 - C5 - D5 - E5 - - -  F5 - E5 - D5 - C5 - D5 - - - G4 - - -  E5 - - - - - C5 - E5 - F5 - G5 - - -  A5 - G5 - F5 - E5 - D5 - - - - - . .  F5 - - - A5 - - - G5 - F5 - E5 - D5 -  E5 - - - G5 - - - C6 - - - G5 - - -  A5 - G5 - F5 - E5 - D5 - E5 - F5 - D5 -  C5 - - - - - - - G4 - A4 - B4 - - -',
    bassPat:'R - - - R - 5 - R - - - 5 - 8 -',harmPat:'R 5 8 5 R 5 8 5 R 5 8 5 R 5 8 5',drum:'k . . . s . . h k . k . s . h h'},
  town:{bpm:116,div:4,chords:'G Em C D C Em Am G',

// songs written as chords: each chord is one bar; patterns pick chord tones (R root, 3, 5, 7, 8 octave)
const NAMES=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
function chordNote(ch,deg,oct){
  const m=/^([A-G])([#b]?)(m?)(7?)$/.exec(ch),root={C:0,D:2,E:4,F:5,G:7,A:9,B:11}[m[1]]+(m[2]==='#'?1:m[2]==='b'?-1:0);
  const off={R:0,3:m[3]?3:4,5:7,7:m[3]?10:(m[4]?10:11),8:12}[deg],midi=(oct+1)*12+root+off;
  return NAMES[(midi%12+12)%12]+(Math.floor(midi/12)-1);
}
function expand(chords,pat,oct){const ps=pat.trim().split(/\s+/);return chords.trim().split(/\s+/).flatMap(ch=>ps.map(x=>x==='.'||x==='-'?x:chordNote(ch,x,oct)))}
for(const s of Object.values(MUSIC)){
  if(s.chords){s.bass=expand(s.chords,s.bassPat,2);s.harm=expand(s.chords,s.harmPat,s.harmOct||3)}
  for(const t of ['lead','bass','drum','arp','harm'])if(typeof s[t]==='string')s[t]=s[t].trim().split(/\s+/);
  console.assert(!s.chords||s.lead.length===s.bass.length,'song bars',s);
}
function freq(n){
  const m=/^([A-G])([#b]?)(\d)$/.exec(n);
  const semi={C:0,D:2,E:4,F:5,G:7,A:9,B:11}[m[1]]+(m[2]==='#'?1:m[2]==='b'?-1:0);
  return 440*Math.pow(2,(semi+(+m[3]+1)*12-69)/12);
}
console.assert(Math.abs(freq('A4')-440)<1e-9&&Math.abs(freq('A3')-220)<1e-9&&chordNote('Am','3',3)==='C4'&&chordNote('D','3',2)==='F#2','freq');
let song=null,step=0,nextT=0;
function playMusic(name){const s=MUSIC[name]||null;if(s===song)return;song=s;step=0;nextT=0}
// lead on pulse 1, harmony or arpeggio on the thin pulse 2, bass on the wave channel, drums on noise
setInterval(()=>{
  if(!ac||!song)return;
  const sp=60/song.bpm/(song.div||2),d1=song.wave==='triangle'?0.25:song.wave==='sawtooth'?0.125:0.5;
  if(nextT<ac.currentTime)nextT=ac.currentTime+0.05;
  while(nextT<ac.currentTime+0.15){
    if(SET.music&&nextT>holdUntil){
      const li=step%song.lead.length,a=song.lead[li];
      if(a!=='.'&&a!=='-')voice('p',freq(a),nextT,sp*(held_(song.lead,li)-0.15),song.wave==='triangle'?0.05:0.045,{duty:d1,vib:14});
      const bi=step%song.bass.length,b=song.bass[bi];
      if(b!=='.'&&b!=='-')voice('w',freq(b),nextT,sp*(held_(song.bass,bi)-0.1),0.11,{sus:0.9});
      const h=song.harm||song.arp;if(h){const hi=step%h.length,c=h[hi];if(c!=='.'&&c!=='-')voice('p',freq(c),nextT,sp*(song.harm?held_(h,hi)-0.2:0.85),song.harm?0.028:0.022,{duty:song.d2||0.125})}
      if(song.drum){const k=song.drum[step%song.drum.length];if(k!=='.')drum(k,nextT)}
    }
    step++;nextT+=sp;
  }
},25);
function held_(trk,i){let n=1;while(n<trk.length&&trk[(i+n)%trk.length]==='-')n++;return n}
function drum(k,t){
  if(k==='k')noise(t,0.1,0.13,0.11,{to:0.05});

}

function makeMon(sp,lv){
  const m={sp,lv,exp:0,moves:[]};
  for(const [l,id] of SP[sp].ls)if(l<=lv&&!m.moves.includes(id))m.moves.push(id);

// battle dice; a link battle swaps in a seeded one so both players roll the same numbers
let rnd=Math.random;
const seeded=s=>()=>{s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
{const a=seeded(7),b=seeded(7);console.assert(a()===b()&&a()===b()&&a()!==seeded(8)(),'seeded rng')}
const stg=s=>s>=0?1+s*0.25:1/(1-s*0.25);
function dmg(a,d,mv,as,ds){
  const A=stat(a,1)*stg(as.atk)*(a.ail==='burn'?0.5:1),D=stat(d,2)*stg(ds.def),e=eff(mv.t,SP[d.sp].t),stab=SP[a.sp].t.includes(mv.t)?1.5:1,crit=rnd()<1/16?1.5:1;
  const roll=0.85+rnd()*0.15;return {n:e?Math.max(1,Math.floor(mv.p*A/D*(a.lv+10)/80*e*stab*crit*roll)+1):0,e,crit:crit>1};
}
{ // self-check: an even lv5 fight takes a handful of hits, not one or twenty

}

const tileAt=(r,c)=>{const R=MAPS[G.map].rows;return r<0||r>=R.length||c<0||c>=R[0].length?null:R[r][c]};
function tryMove(d){
  G.face=d;const [dc,dr]=DIRS[d],nr=G.r+dr,nc=G.c+dc,mp=MAPS[G.map],t=tileAt(nr,nc);
  if(t===null){
    if(nr<0&&mp.north!=null){
      if(G.map===0&&!G.F.starter){say(['윤슬','잠깐! 동료도 없이 풀숲에 들어가면 위험하다. 이리 오너라.']);return}
      changeMap(mp.north,MAPS[mp.north].rows.length-1,G.c);
    }else if(nr>=mp.rows.length&&mp.south!=null)changeMap(mp.south,0,G.c);
    return;
  }
  if(t==='D'){door(nr,nc);return}
  if(t==='V'){SFX.back();changeMap(5,16,10,'up');return}
  if(t==='J'){ // ledges: hop down over them, never climb back up
    const lt=tileAt(nr+1,nc);
    if(d!=='down'||lt===null||SOLID.includes(lt)||lt==='J'||npcAt(nr+1,nc)||itemAt(nr+1,nc)){if(hit(d))SFX.bump();return}
    M.moving=true;M.t=0;M.dr=2;M.dc=0;M.jump=true;M.step=(M.step||0)+1;SFX.jump();sendPos();return;
  }
  if(SOLID.includes(t)||npcAt(nr,nc)||itemAt(nr,nc)){if(hit(d))SFX.bump();return}
  M.moving=true;M.t=0;M.dr=dr;M.dc=dc;M.jump=false;M.run=!!held.back;M.step=(M.step||0)+1;sendPos();
}
function arrive(){
  const t=tileAt(G.r,G.c),mp=MAPS[G.map];
  if(t==='E'){const [m,r,c]=mp.exit||[3,5,23];changeMap(m,r,c,'down');return}
  if(checkTrainers())return;
  if((t==='g'||t==='u')&&mp.enc&&G.party.some(m=>m.hp>0)&&Math.random()<(t==='u'?0.07:0.1)){
    const tot=mp.enc.reduce((a,e)=>a+e[3],0);let r=Math.random()*tot,e=mp.enc[0];
    for(const x of mp.enc){if((r-=x[3])<0){e=x;break}}
    const lv=e[1]+Math.floor(Math.random()*(e[2]-e[1]+1));
    const mon=makeMon(e[0],lv);if(Math.random()<1/128)mon.shiny=true;
    Q.push(()=>{SFX.enc();M.flashAt=T},{wait:0.6},()=>startBattle([mon],null));
  }
}
function checkTrainers(){
  for(const n of npcs(G.map)){
    if(!n.party||G.F.beat[n.id])continue;
    const [dc,dr]=DIRS[n.face];
    for(let k=1;k<=4;k++){
      const r=n.r+dr*k,c=n.c+dc*k;
      if(r===G.r&&c===G.c){G.face=OPP[n.face];challenge(n);return true}
      const t=tileAt(r,c);if(t===null||SOLID.includes(t)||t==='J'||npcAt(r,c)||itemAt(r,c))break;
    }
  }
  return false;
}

function drawMap(){
  const mp=MAPS[G.map],R=mp.rows,g=lg;
  const px=(G.c+(M.moving?M.dc*M.t:0))*TS,py=(G.r+(M.moving?M.dr*M.t:0))*TS;
  const MW=R[0].length;
  cam={x:clamp(px+8-160,0,MW*TS-320),y:clamp(py+8-120,0,R.length*TS-240)};
  g.save();g.translate(-Math.round(cam.x),-Math.round(cam.y));
  const r0=Math.floor(cam.y/TS),c0=Math.floor(cam.x/TS),c1=Math.min(MW,c0+21);
  for(let r=r0;r<Math.min(R.length,r0+16);r++)for(let c=c0;c<c1;c++)drawTile(g,R[r][c],c*TS,r*TS,r,c,R);
  for(const k in DOORS){
    const [m,r,c]=k.split(':').map(Number),kind=DOORS[k];if(m!==G.map||!PLATES[kind])continue;
    const x=c*TS,y=(r-1)*TS;g.fillStyle='#3a2a1a';g.fillRect(x+2,y+3,12,9);g.fillStyle=PLATES[kind];g.fillRect(x+3,y+4,10,7);g.fillStyle='#fff';
    if(kind==='heal'){g.fillRect(x+7,y+5,2,5);g.fillRect(x+5,y+6,6,2)}else if(kind==='shop'){g.fillRect(x+6,y+5,4,5);g.fillStyle=PLATES.shop;g.fillRect(x+7,y+6,2,3)}else{g.fillRect(x+5,y+5,6,5);g.fillStyle=PLATES.lab;g.fillRect(x+8,y+5,1,5)}
  }
  const ents=[];
  for(let r=r0;r<Math.min(R.length,r0+17);r++)for(let c=c0;c<c1;c++)if(R[r][c]==='T')ents.push({y:r,draw:()=>g.drawImage(TREE,c*TS,r*TS-2)});
  for(const k in ITEM_SPOTS){const [m,r,c]=k.split(':').map(Number);if(m===G.map&&!G.F.got[k])ents.push({y:r,draw:()=>g.drawImage(BUNDLE,c*TS+2,r*TS+3)})}
  ents.push(...npcs(G.map).map((n,i)=>({y:n.r,draw:()=>{
    const x=n.c*TS,y=n.r*TS;
    g.fillStyle='rgba(0,0,0,.22)';g.fillRect(x+3,y+13,10,3);
    if(n.mon){drawMonAt(n.mon,x+8,y+16+Math.round(Math.sin(T*2)),0.75,{g,seed:7});return}
    drawPerson(g,LOOK[n.look],n.face,0,x,y);
    if(n.alert){g.fillStyle='#202030';g.fillRect(x+3,y-23,10,13);g.fillStyle='#fff';g.fillRect(x+4,y-22,8,11);g.fillStyle='#e04040';g.fillRect(x+7,y-20,2,5);g.fillRect(x+7,y-14,2,2)}
  }})));
  ents.push({y:py/TS,draw:()=>{
    g.fillStyle='rgba(0,0,0,.22)';g.fillRect(px+3,py+13,10,3);
    const hop=M.moving&&M.jump?Math.round(Math.sin(M.t*Math.PI)*8):0;
    drawPerson(g,LOOK.player,G.face,M.moving&&M.t>0.2&&M.t<0.8?1+M.step%2:0,px,py-hop);
  }});
  const peers=Object.values(NET.peers).filter(p=>p.m===G.map);
  for(const p of peers){
    p.x+=(p.c*TS-p.x)*0.25;p.y+=(p.r*TS-p.y)*0.25;
    const walking=Math.abs(p.c*TS-p.x)+Math.abs(p.r*TS-p.y)>1;
    ents.push({y:p.y/TS,draw:()=>{g.fillStyle='rgba(0,0,0,.22)';g.fillRect(Math.round(p.x)+3,Math.round(p.y)+13,10,3);drawPerson(g,p.look,p.f,walking?1+(T*7|0)%2:0,p.x,p.y)}});
  }
  ents.sort((a,b)=>a.y-b.y).forEach(e=>e.draw());
  g.restore();
  if(mp.mist)for(let i=0;i<6;i++){g.fillStyle='rgba(225,232,245,.13)';const x=((T*8+i*90)%440)-60,y=20+i*38+Math.sin(T*0.7+i)*8;g.beginPath();g.ellipse(x,y,70,14,0,0,7);g.fill()}
  if(G.map===4&&!G.F.badge){g.fillStyle='rgba(10,10,30,.25)';g.fillRect(0,0,320,240)}
  if(mp.cave){const sx=px-cam.x+8,sy=py-cam.y+8,dk=g.createRadialGradient(sx,sy,26,sx,sy,150);dk.addColorStop(0,'rgba(6,4,14,0)');dk.addColorStop(1,'rgba(6,4,14,.9)');g.fillStyle=dk;g.fillRect(0,0,320,240)}
  ctx.imageSmoothingEnabled=false;ctx.drawImage(low,0,0,W,H);
  for(const p of peers){ // name tags at full resolution so the text stays sharp
    ctx.font=`700 13px ${FONT}`;const w=ctx.measureText(p.name).width+12,x=Math.round((p.x+8-cam.x)*2),y=Math.round((p.y-cam.y)*2)-34;
    rr(x-w/2,y,w,18,6,'rgba(30,40,60,.8)');text(p.name,x,y+2,13,'#ffffff','center');
  }
  if(T-M.flashAt<0.6&&((T-M.flashAt)*10|0)%2===0){ctx.fillStyle='rgba(255,255,255,.8)';ctx.fillRect(0,0,W,H)}
  if(M.banner>0){ // wooden area plaque sliding down from the top
    M.banner-=1/60;const yy=Math.round(-60*Math.max(0,M.banner-2.1)/0.3-60*Math.max(0,0.3-M.banner)/0.3)+12;
    rr(16,yy,230,48,8,'#4a2c14');rr(19,yy+3,224,42,6,'#c88848');ctx.fillStyle='#e0a868';ctx.fillRect(25,yy+6,212,3);
    text(mp.name,131,yy+12,22,'#fff8e8','center');
  }
}

function canUse(id,m){const it=ITEMS[id];return it.revive?m.hp<=0:it.cure?m.hp>0&&!!m.ail:!!it.heal&&m.hp>0&&m.hp<maxhp(m)}
function applyItem(id,m){
  const it=ITEMS[id],mx=maxhp(m);G.bag[id]--;
  if(it.revive){m.hp=Math.ceil(mx/2);return `${jo(nm(m),'이','가')} 깨어났다!`}
  if(it.cure){const a=AIL[m.ail].n;delete m.ail;delete m.slp;return `${nm(m)}의 ${a} 상태가 나았다.`}
  const n=Math.min(mx-m.hp,it.heal);m.hp+=n;return `${nm(m)}의 HP가 ${n} 회복되었다.`;
}
function fieldBag(){
  open(bagMenu(id=>{
    if(ITEMS[id].ball){SFX.no();toast('인연실은 야생 생물과 싸울 때 쓴다.');return}

      const m=G.party[i];if(!canUse(id,m)){SFX.no();toast('효과가 없을 것 같다.');return}

    }}));
  }));

async function netConnect(){

  if(location.hash==='#local'){
    const bc=new BroadcastChannel('deulpul-net');NET.bc=bc;NET.me=1+Math.floor(Math.random()*1e9);
    bc.onmessage=e=>{const x=e.data;if(x&&x.from!==NET.me&&(!x.to||x.to===NET.me))netEvent(x.c,x.d,x.from)};
    NET.send=(c,d,to)=>bc.postMessage({c,d,from:NET.me,to});NET.on=true;NET.status='로컬 테스트';sendPos();return;
  }

  try{await loadPhoton()}catch(e){NET.status='접속 안 함';toast('멀티 기능을 불러오지 못했다. 인터넷 연결을 확인해 줘.');return}

  NET.lbc=lbc;lbc.myActor().setName(G.name);

    else if(st===L.State.Joined){NET.on=true;NET.me=lbc.myActor().actorNr;NET.status='접속 중';toast('다른 기록원들과 연결되었다.');sendPos()}

    else NET.status='접속하는 중';
  };

  lbc.onActorLeave=a=>netLeave(a.actorNr);

function netDrop(msg){

function netAbort(nr){

  if(B&&B.pvp&&B.pvp.peer===nr&&!B.over){B.over=true;NET.send(EV.CANCEL,{},nr);Q.length=0;UI.length=0;now('상대와의 연결이 끊겼다.',()=>endBattle('pvp'))}

const peerAt=(r,c)=>Object.values(NET.peers).find(p=>p.m===G.map&&p.r===r&&p.c===c);
const busy=()=>scene!=='map'||Q.length||UI.length||M.moving||NET.req||NET.trade||!G.party.length;
function netEvent(c,d,from){
  if(!G||scene==='title'||!d||typeof d!=='object')return;
  if(c===EV.POS){
    if(!MAPS[d.m]||!Number.isInteger(d.r)||!Number.isInteger(d.c)||!DIRS[d.f])return;
    const p=NET.peers[from]||(NET.peers[from]={nr:from,look:PEER_LOOKS[from%PEER_LOOKS.length]});
    if(p.m!==d.m){p.x=d.c*TS;p.y=d.r*TS}
    Object.assign(p,{name:String(d.n||'기록원').slice(0,8),m:d.m,r:d.r,c:d.c,f:d.f,last:T});
    if(!p.seen){p.seen=true;sendPos()} // say hello back so newcomers see us right away
    return;
  }

      if(!NET.peers[from]){now('상대가 떠나 버렸다.');return}

    });
  }else if(c===EV.ANS){
    const r=NET.req;
    if(r&&r.peer===from&&r.nonce===d.nonce&&!r.ans)r.ans={ok:!!d.ok&&(r.kind!=='battle'||!!cleanParty(d.party)),busy:d.busy,party:cleanParty(d.party)};
    else if(d.ok)NET.send(EV.CANCEL,{},from); // we had already given up waiting
  }else if(c===EV.ACT){
    const a=d.a;if(!a)return;
    if(!(B&&B.pvp&&B.pvp.peer===from)){NET.early={from,d};return}
    if(B.over)return;
    if(a.k==='run'){B.over=true;Q.length=0;UI.length=0;now(`${jo(pe.name,'이','가')} 승부를 포기했다.`,`${pe.name}에게 이겼다!`,()=>endBattle('pvp'));return}
    // a choice can arrive a turn early (our screen was paused, theirs wasn't): keep it until that turn comes

    const t=NET.trade;if(t&&t.peer===from)t.theirs=cleanMon(d.mon);

    if(!d.ok){NET.trade=null;UI.length=0;toast('상대가 교환을 그만두었다.')}else t.theirOk=true;
  }else if(c===EV.CANCEL)netAbort(from);
}

    side:m=>{box(300,m.y+m.h+8,320,72);text('상태: '+NET.status,318,m.y+m.h+22,16,INK);text(`같은 세계: ${NET.on?Object.keys(NET.peers).length+1:0}명`,318,m.y+m.h+46,16,DIM)}}));
}
function peerMenu(pe){
  ask('',`${pe.name}에게 무엇을 할까?`,['대전 신청','교환 신청','그만두기'],i=>{
    if(i===2)return;
    const kind=i?'trade':'battle';
    if(!G.party.length){now('함께하는 동료가 없다.');return}
    const r=NET.req={peer:pe.nr,kind,nonce:1+Math.floor(Math.random()*2e9),ans:null,t0:T};
    NET.send(EV.REQ,{kind,nonce:r.nonce,party:kind==='battle'?G.party.map(cleanMon):null},pe.nr);
    now({until:()=>r.ans||T-r.t0>20,note:`${pe.name}의 대답을 기다리는 중`},()=>{
      NET.req=null;
      if(!r.ans){NET.send(EV.CANCEL,{},pe.nr);now('대답이 없다.');return}
      if(!r.ans.ok){now(r.ans.busy?`${jo(pe.name,'은','는')} 지금 바쁜 것 같다.`:`${jo(pe.name,'이','가')} 거절했다.`);return}
      kind==='battle'?startPvp(pe.nr,r.ans.party,r.nonce,NET.me<pe.nr):startTrade(pe.nr);
    });
  });
}
// link battle: both players run the same turns with the same seeded dice; full-HP copies, nothing carries over
function startPvp(peer,theirs,seed,host){
  const pe=NET.peers[peer];if(!pe)return;
  rnd=seeded(seed);
  startBattle(theirs,{name:pe.name,cls:'기록원',pvp:true,id:'pvp',lookSpr:pe.look},G.party.map(cleanMon));
  B.pvp={peer,turn:0,mine:null,theirs:null,host,ahead:{}};
  if(NET.early&&NET.early.from===peer&&NET.early.d.t===0)B.pvp.ahead[0]=NET.early.d.a;
  NET.early=null;
}
function pvpChoose(a){
  const P=B.pvp;
  if(a.k==='run'){NET.send(EV.ACT,{t:P.turn,a:{k:'run'}},P.peer);B.over=true;now('승부를 포기했다.',()=>endBattle('pvp'));return}
  P.mine=a;NET.send(EV.ACT,{t:P.turn,a},P.peer);const t0=T;
  now({until:()=>B.over||P.ahead[P.turn]||T-t0>90,note:'상대의 선택을 기다리는 중'},()=>{
    if(B.over)return;
    const b=P.ahead[P.turn];delete P.ahead[P.turn];
    if(!b){NET.send(EV.CANCEL,{},P.peer);B.over=true;now('상대의 응답이 없어 대전을 끝냈다.',()=>endBattle('pvp'));return}
    // checked only now, against the board this turn is actually played on
    const ok=b.k==='move'?foe().moves.includes(b.id):b.k==='switch'&&B.foes[b.i]&&B.foes[b.i].hp>0&&b.i!==B.fi;
    if(!ok){netAbort(P.peer);return}
    P.theirs=b;pvpResolve();
  });
}
function pvpResolve(){
  const P=B.pvp,a=P.mine,b=P.theirs,order=P.host?[1,0]:[0,1];P.mine=P.theirs=null;P.turn++;
  const steps=[];
  for(const s of order){const x=s?a:b;if(x.k==='switch')steps.push(s?()=>now(...sendOut(a.i,true)):()=>now(...foeSwap(b.i)))}
  steps.push(()=>{
    const moves=[];if(a.k==='move')moves.push([1,pl(),a.id]);if(b.k==='move')moves.push([0,foe(),b.id]);
    // faster goes first; ties go to the host on both screens
    moves.sort((x,y)=>(MV[y[2]].pri||0)-(MV[x[2]].pri||0)||spd(y[1],y[0])-spd(x[1],x[0])||order.indexOf(x[0])-order.indexOf(y[0]));
    now(...moves.map(([s,m,id])=>attackStep(s,m,id)));
  },()=>now(...order.map(residual)),()=>{if(!B.over)turnMenu()});
  now(...steps);
}
function foeSwap(i){
  return [{text:`${jo(B.tr.name,'은','는')} ${jo(nm(foe()),'을','를')} 불러들였다.`,auto:1},()=>{B.foeVis=false},
    ()=>{B.fi=i;B.st[0]={atk:0,def:0,spd:0};B.dhp[0]=foe().hp;see(foe().sp);B.foeVis=true;B.foeX=240;B.anim.faint0=null;SFX.pop();cry(foe().sp);
      now({text:`${jo(B.tr.name,'은','는')} ${jo(nm(foe()),'을','를')} 내보냈다!`,auto:1})}].map(toStep);
}
// trade: each picks one, both confirm, then each side swaps its own copy
function startTrade(peer){
  const t=NET.trade={peer,myI:null,theirs:null,theirOk:false};
  open(partyMenu({title:'교환할 동료를 고르세요',onBack:()=>{close();tradeCancel()},onPick:i=>{
    close();if(NET.trade!==t)return;
    t.myI=i;NET.send(EV.OFFER,{mon:cleanMon(G.party[i])},peer);
    now({until:()=>NET.trade!==t||t.theirs,note:'상대가 고르기를 기다리는 중'},()=>{
      if(NET.trade!==t)return;
      ask('',`${jo(nm(G.party[t.myI]),'을','를')} 보내고 ${jo(nm(t.theirs),'을','를')} 받을까?`,['교환한다','그만둔다'],j=>{
        if(NET.trade!==t)return;
        if(j){tradeCancel();return}
        NET.send(EV.OK,{ok:true},peer);
        now({until:()=>NET.trade!==t||t.theirOk,note:'상대의 확인을 기다리는 중'},()=>{
          if(NET.trade!==t)return;NET.trade=null;
          const gave=G.party[t.myI],got=t.theirs;G.party[t.myI]=got;own(got.sp);saveGame(true);
          now(()=>jingle(['C5','E5','G5','C6'],0.12),`${jo(nm(gave),'을','를')} 보내고 ${jo(nm(got),'을','를')} 받았다!`);
        });
      });
    });
  }}));
}
function tradeCancel(){const t=NET.trade;if(!t)return;NET.trade=null;NET.send(EV.OK,{ok:false},t.peer);now('교환을 그만두었다.')}

// title: the king's shadow crosses the moon, the lighthouse flares, the logo drops in, the starters hop up, then "press start"
let titleSel=0;
const TT={e:0,ready:false},T_LIT=2.2,T_START=3.6;
function updTitle(dt){
  const was=TT.e;TT.e+=dt;
  if(was<T_LIT&&TT.e>=T_LIT)SFX.enc();
  if(!TT.ready){
    if(hit('ok')||hit('back')){if(TT.e<T_START)TT.e=T_START;else{TT.ready=true;SFX.ok()}}
    return;
  }
  const has=!!SAVED,n=2;
  if(hit('back')){TT.ready=false;SFX.back();return}
  if(hit('up')||hit('down')){titleSel=(titleSel+1)%n;SFX.move()}
  if(hit('ok')){
    if(titleSel===1&&!has){SFX.no();return}
    SFX.ok();
    if(titleSel===1){G=SAVED;scene='map';changeMap(G.map,G.r,G.c);M.banner=2.4}

      say('바닷바람이 닿는 작은 마을, 새벽마을.','이 고장 사람들은 들에 사는 생물과 인연을 맺고 함께 길을 걷는다.',`오늘은 ${G.name}, 네가 동행 기록원으로 첫발을 떼는 날이다.`,'기록관 앞에서 윤슬 선생님이 기다리고 있다. (방향키로 걷고, Z로 말을 건다)'))}

}
const LOGO_FONT='"Black Han Sans","Nanum Gothic Coding",sans-serif';

// chunky yellow letters on a thick navy rim with a dark extrusion; a light sheen sweeps across every few seconds

function sparkle(x,y,r,a){ctx.globalAlpha=a;ctx.fillStyle='#fff';ctx.beginPath();ctx.moveTo(x,y-r);ctx.lineTo(x+r*.25,y);ctx.lineTo(x,y+r);ctx.lineTo(x-r*.25,y);ctx.fill();

function drawTitle(){

  }
  text(TT.ready?'Z 결정 · X 뒤로 · ↑↓ 선택':'',20,456,14,'#8a84a3');text('v'+GAME_VERSION,620,456,14,'#8a84a3','right');

    ()=>startBattle([makeMon('donggun',20)],null,null,'탈색의 왕 동건이 모습을 드러냈다!'));

// ---------- main loop ----------
let last=0;
function frame(ts){
  // one bad step must not stop the loop: log it and keep the game running
  try{tick(ts)}catch(e){console.error(e);pressed.clear()}
  requestAnimationFrame(frame);
}
function tick(ts){
  const dt=Math.min(0.05,(ts-last)/1000||0);last=ts;T+=dt;
  if(toastT>0)toastT-=dt;
  netTick();
  if(scene==='title')updTitle(dt);
  else{
    if(scene==='battle')updBattle(dt);
    if(EVO)EVO.t+=dt;
    if(UI.length)UI[UI.length-1].upd(dt);
    else if(Q.length)runQ(dt);
    else if(scene==='map')updMap(dt);
    else if(scene==='ending')updEnding();
  }
  ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
  if(scene==='title')drawTitle();else if(scene==='map')drawMap();else if(scene==='battle')drawBattle();else if(scene==='ending')drawEnding();
  if(EVO)drawEvo();
  const s=Q[0];if(s&&s.ty)dialogBox(s.name,s.ty);
  else if(s&&s.note){box(20,328,600,140);text(s.note+'.'.repeat((T*2|0)%4),40,352,22,DIM)}
  for(const u of UI)u.draw();
  if(toastT>0){ctx.globalAlpha=clamp(toastT*2,0,1);ctx.font=`700 18px ${FONT}`;const w=ctx.measureText(toastS).width+40;box(W/2-w/2,20,w,48);text(toastS,W/2,34,18,INK,'center');ctx.globalAlpha=1}
  pressed.clear();
}
const SAVED=readSave();
requestAnimationFrame(frame);
playMusic('title');
