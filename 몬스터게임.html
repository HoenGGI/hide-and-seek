<meta charset="utf-8">
<title>들풀 동행기</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Gothic+Coding:wght@700&display=swap">
<style>
/* layout: one 4:3 game screen centered; touch pad under it on phones. Deliberately single dark theme (arcade screen). */
:root{
  --bg:#07060b; --fg:#f4f1ff; --dim:#8a84a3; --accent:#ffe14d; --pad:#1b1826; --pad-line:#3a3550;
  --mono:"Nanum Gothic Coding","D2Coding",Consolas,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--mono);display:flex;flex-direction:column;align-items:center;gap:12px;
  padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box;margin:0}
:root{--reserve:72px}
body{justify-content:center}
#game{width:min(100%,calc((100vh - var(--reserve))*4/3));width:min(100%,calc((100dvh - var(--reserve))*4/3));aspect-ratio:4/3;image-rendering:pixelated;background:#000;display:block;touch-action:none}
@media (pointer:coarse){:root{--reserve:260px}}
@media (pointer:coarse) and (orientation:landscape){
  :root{--reserve:24px}
  .hint{display:none}
  .pad{position:fixed;left:0;right:0;bottom:max(12px,env(safe-area-inset-bottom,0px));max-width:none;
    padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));box-sizing:border-box;pointer-events:none}
  .pad>*{pointer-events:auto;opacity:.8}
}
.hint{color:var(--dim);font-size:13px;text-align:center;margin:0}
.pad{display:none;width:100%;max-width:640px;justify-content:space-between;align-items:center;gap:16px;user-select:none;-webkit-user-select:none}
@media (pointer:coarse){.pad{display:flex}}
.dpad{display:grid;grid-template-columns:repeat(3,56px);grid-template-rows:repeat(3,56px);gap:4px}
.pad button{background:var(--pad);color:var(--fg);border:2px solid var(--pad-line);border-radius:10px;font:inherit;font-size:18px;touch-action:none}
.pad button.on{background:var(--pad-line)}
.ab{display:flex;gap:12px}
.ab button{width:72px;height:72px;border-radius:50%}
button:focus-visible{outline:2px solid var(--accent)}
:root{--panel:#f8f8f0;--ink:#303848;--frame:#2c3c50;--frame2:#78a8d0}
.form{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:10;width:min(380px,calc(100% - 32px));box-sizing:border-box;
  background:var(--panel);color:var(--ink);border:4px solid var(--frame);outline:3px solid var(--frame2);outline-offset:-8px;border-radius:14px;
  padding:20px 22px;display:flex;flex-direction:column;gap:14px;font-family:var(--mono)}
.form[hidden]{display:none}
.form p{margin:0;font-size:18px;color:#2f62b8}
#form-fields{display:flex;flex-direction:column;gap:12px}
.form label{display:flex;flex-direction:column;gap:6px;font-size:14px}
.form input{font:inherit;font-size:18px;padding:8px 10px;border:2px solid var(--frame2);border-radius:8px;background:#fff;color:var(--ink);min-width:0}
.form input:focus-visible{outline:2px solid var(--frame);outline-offset:1px}
.form-row{display:flex;gap:10px;justify-content:flex-end}
.form-row button{font:inherit;font-size:16px;padding:8px 16px;border-radius:8px;border:2px solid var(--frame);background:var(--frame);color:var(--panel);cursor:pointer}
.form-row button[type=button]{background:transparent;color:var(--ink)}
.form-row button[hidden]{display:none}
</style>

<canvas id="game" width="640" height="480" aria-label="들풀 동행기 게임 화면"></canvas>
<form id="netform" class="form" hidden><p id="form-title"></p><div id="form-fields"></div>
  <div class="form-row"><button type="submit" id="form-ok">확인</button><button type="button" id="form-cancel">취소</button></div></form>
<p class="hint">방향키: 이동 · Z / Enter: 결정·조사 · X / Shift: 취소 · C / Esc: 메뉴 · M: 음악 켜기/끄기</p>
<div class="pad">
  <div class="dpad">
    <button data-k="menu" aria-label="메뉴">C</button><button data-k="up" aria-label="위">▲</button><span></span>
    <button data-k="left" aria-label="왼쪽">◀</button><button data-k="mute" aria-label="음악 끄기/켜기">♪</button><button data-k="right" aria-label="오른쪽">▶</button>
    <span></span><button data-k="down" aria-label="아래">▼</button><span></span>
  </div>
  <div class="ab"><button data-k="back" aria-label="취소">X</button><button data-k="ok" aria-label="결정">Z</button></div>
</div>

<script>
const cv=document.getElementById('game');
const ctx=cv.getContext('2d');
const W=640,H=480,TS=16;
const FONT='"Nanum Gothic Coding","D2Coding",Consolas,monospace';
const DIRS={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};
const OPP={up:'down',down:'up',left:'right',right:'left'};
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
// Korean particle by final consonant: jo('서진','이','가') -> '서진이'
const jo=(w,a,b)=>{const c=w.charCodeAt(w.length-1)-0xAC00;return w+(c>=0&&c<11172&&c%28?a:b)};

// ---------- input ----------
const held={},pressed=new Set();
const KEYS={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',z:'ok',Z:'ok',Enter:'ok',' ':'ok',x:'back',X:'back',Shift:'back',m:'mute',M:'mute',c:'menu',C:'menu',Escape:'menu'};
function press(k){initAudio();if(k==='mute'){SET.music=!SET.music;saveSettings();return}if(!held[k])pressed.add(k);held[k]=true}
function release(k){held[k]=false}
addEventListener('keydown',e=>{if(e.target.closest&&e.target.closest('#netform'))return;const k=KEYS[e.key];if(!k)return;e.preventDefault();if(!e.repeat)press(k)});
addEventListener('keyup',e=>{const k=KEYS[e.key];if(k)release(k)});
document.querySelectorAll('.pad button').forEach(b=>{
  const k=b.dataset.k;
  b.addEventListener('pointerdown',e=>{e.preventDefault();press(k);b.classList.add('on')});
  for(const ev of ['pointerup','pointerleave','pointercancel'])b.addEventListener(ev,()=>{release(k);b.classList.remove('on')});
});
cv.addEventListener('pointerdown',()=>press('ok'));
cv.addEventListener('pointerup',()=>release('ok'));
const hit=k=>pressed.has(k);

// ---------- sound ----------
let ac=null;
const SETTINGS_KEY='deulpul-settings-v1';
const SET={music:true,sfx:true};
try{Object.assign(SET,JSON.parse(localStorage.getItem(SETTINGS_KEY))||{})}catch(e){}
function saveSettings(){try{localStorage.setItem(SETTINGS_KEY,JSON.stringify(SET))}catch(e){}}
function initAudio(){if(ac)return;try{ac=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}
function beep(f,d=0.06,type='square',v=0.05,slide=0){
  if(!ac||!SET.sfx)return;const t=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g).connect(ac.destination);o.start(t);o.stop(t+d+0.02);
}
const SFX={
  blip:()=>beep(560,0.03,'square',0.03),low:()=>beep(330,0.045,'triangle',0.06),high:()=>beep(760,0.035,'square',0.03),
  move:()=>beep(700,0.04,'square',0.04),ok:()=>beep(900,0.07,'square',0.05),back:()=>beep(520,0.07,'square',0.04,-150),
  no:()=>beep(160,0.12,'square',0.05),bump:()=>beep(110,0.06,'square',0.04),
  hit:()=>beep(180,0.18,'sawtooth',0.07,-120),big:()=>beep(120,0.28,'sawtooth',0.08,-80),weak:()=>beep(320,0.1,'triangle',0.06,-100),
  heal:()=>beep(600,0.25,'triangle',0.06,500),alert:()=>beep(1200,0.12,'square',0.05,300),throw:()=>beep(900,0.25,'triangle',0.05,-600),
  wob:()=>beep(380,0.07,'square',0.05),pop:()=>beep(700,0.14,'square',0.05,-400),faint:()=>beep(420,0.45,'square',0.05,-360),
  enc:()=>beep(200,0.45,'sawtooth',0.06,700),stat:()=>beep(500,0.2,'triangle',0.05,300),statDown:()=>beep(700,0.2,'triangle',0.05,-350),
};
function jingle(ns,st=0.13){ns.forEach((n,i)=>setTimeout(()=>beep(freq(n),st*1.6,'square',0.05),i*st*1000))}

// ---------- music: tiny chiptune sequencer, one token = one 8th note, '.' = rest, '-' holds ----------
const MUSIC={
  town:{bpm:100,wave:'triangle',
    lead:'G4 - B4 - D5 - B4 -  C5 - E5 - D5 - - -  B4 - G4 - A4 - B4 -  A4 - - - - - . .  G4 - B4 - D5 - G5 -  F#5 - E5 - D5 - - -  C5 - B4 - A4 - F#4 -  G4 - - - - - . .',
    bass:'G2 - D3 - G2 - D3 -  C3 - G3 - G2 - D3 -  E2 - B2 - E2 - B2 -  D2 - A2 - D2 - A2 -  G2 - D3 - G2 - D3 -  D2 - A2 - B2 - D3 -  C3 - G3 - D3 - A2 -  G2 - D3 - G2 - . .',
    arp:'G3 B3 D4 B3 G3 B3 D4 B3  C4 E4 G4 E4 G3 B3 D4 B3  E3 G3 B3 G3 E3 G3 B3 G3  D3 F#3 A3 F#3 D3 F#3 A3 F#3'},
  route:{bpm:122,
    lead:'E5 - E5 D5 C5 - D5 -  E5 - G5 - E5 - - -  D5 - D5 C5 B4 - C5 -  D5 - - - - - . .  C5 - C5 D5 E5 - G5 -  A5 - G5 - E5 - D5 -  C5 - D5 - E5 - D5 -  C5 - - - - - . .',
    bass:'C3 . G2 . C3 . G2 .  A2 . E3 . A2 . E3 .  G2 . D3 . G2 . D3 .  G2 . B2 . D3 . B2 .  F2 . C3 . F2 . C3 .  A2 . E3 . A2 . E3 .  F2 . C3 . G2 . D3 .  C3 . G2 . C3 . . .',
    arp:'C4 E4 G4 E4 C4 E4 G4 E4  A3 C4 E4 C4 A3 C4 E4 C4  G3 B3 D4 B3 G3 B3 D4 B3  G3 B3 D4 B3 G3 B3 D4 B3',drum:'k . h . s . h .'},
  tower:{bpm:88,wave:'triangle',
    lead:'A4 - - - C5 - - -  B4 - - - G4 - - -  A4 - - - E5 - - -  D5 - - - - - . .  F5 - - - E5 - - -  D5 - - - C5 - - -  B4 - - - G#4 - - -  A4 - - - - - . .',
    bass:'A2 - - - - - - -  E2 - - - - - - -  F2 - - - - - - -  E2 - - - - - - -',
    arp:'A3 C4 E4 C4 A3 C4 E4 C4  E3 G#3 B3 G#3 E3 G#3 B3 G#3  F3 A3 C4 A3 F3 A3 C4 A3  E3 G#3 B3 G#3 E3 G#3 B3 G#3'},
  legend:{bpm:120,wave:'sawtooth',
    lead:'E5 - - - B4 - - -  C5 - D5 - E5 - G5 -  F#5 - - - D5 - - -  E5 - - - - - . .  G5 - - - F#5 - E5 -  D5 - - - B4 - - -  C5 - D5 - E5 - F#5 -  B4 - - - - - . .',
    bass:'E2 . E2 B2 E2 . E2 B2  C2 . C2 G2 C2 . C2 G2  D2 . D2 A2 D2 . D2 A2  B1 . B1 F#2 B1 . B1 F#2',
    arp:'E4 G4 B4 G4 E4 G4 B4 G4  C4 E4 G4 E4 C4 E4 G4 E4  D4 F#4 A4 F#4 D4 F#4 A4 F#4  B3 D#4 F#4 D#4 B3 D#4 F#4 D#4',drum:'k . s . k k s h'},
  battle:{bpm:152,
    lead:'A4 - C5 - E5 - A5 -  G5 - E5 - C5 - D5 -  E5 - - - D5 C5 B4 -  C5 - - - - - . .  F5 - E5 - D5 - C5 -  B4 - C5 - D5 - E5 -  F5 - E5 - D5 - B4 -  E5 - - - - - . .',
    bass:'A2 A3 A2 A3 A2 A3 A2 A3  F2 F3 F2 F3 F2 F3 F2 F3  G2 G3 G2 G3 G2 G3 G2 G3  E2 E3 E2 E3 E2 E3 E2 E3',
    arp:'A3 C4 E4 C4 A3 C4 E4 C4  F3 A3 C4 A3 F3 A3 C4 A3  G3 B3 D4 B3 G3 B3 D4 B3  E3 G#3 B3 G#3 E3 G#3 B3 G#3',drum:'k h s h k k s h'},
  leader:{bpm:140,wave:'sawtooth',
    lead:'D5 - - - A4 - D5 -  F5 - - - E5 - D5 -  C5 - - - A4 - C5 -  E5 - - - - - . .  D5 - F5 - A5 - - -  G5 - F5 - E5 - C5 -  D5 - E5 - F5 - E5 -  D5 - - - - - . .',
    bass:'D2 . D2 D3 . D2 C3 D3  Bb1 . Bb1 Bb2 . Bb1 A2 Bb2  C2 . C2 C3 . C2 Bb2 C3  A1 . A1 A2 . A1 C#3 A2',
    arp:'D4 F4 A4 F4 D4 F4 A4 F4  Bb3 D4 F4 D4 Bb3 D4 F4 D4  C4 E4 G4 E4 C4 E4 G4 E4  A3 C#4 E4 C#4 A3 C#4 E4 C#4',drum:'k h s h k k s h'},
};
for(const s of Object.values(MUSIC))for(const t of ['lead','bass','drum','arp'])if(s[t])s[t]=s[t].trim().split(/\s+/);
function freq(n){
  const m=/^([A-G])([#b]?)(\d)$/.exec(n);
  const semi={C:0,D:2,E:4,F:5,G:7,A:9,B:11}[m[1]]+(m[2]==='#'?1:m[2]==='b'?-1:0);
  return 440*Math.pow(2,(semi+(+m[3]+1)*12-69)/12);
}
console.assert(Math.abs(freq('A4')-440)<1e-9&&Math.abs(freq('A3')-220)<1e-9,'freq');
let echo=null;
function echoBus(){
  if(echo)return echo;
  echo=ac.createDelay();echo.delayTime.value=0.27;
  const fb=ac.createGain(),wet=ac.createGain();fb.gain.value=0.33;wet.gain.value=0.4;
  echo.connect(fb).connect(echo);echo.connect(wet).connect(ac.destination);
  return echo;
}
function tone(f,t,d,type,v,send){
  const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v,t+0.008);g.gain.setValueAtTime(v,t+d*0.6);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g).connect(ac.destination);if(send)g.connect(echoBus());o.start(t);o.stop(t+d+0.02);
}
let song=null,step=0,nextT=0;
function playMusic(name){const s=MUSIC[name]||null;if(s===song)return;song=s;step=0;nextT=0}
setInterval(()=>{
  if(!ac||!song)return;
  const sp=60/song.bpm/2;
  if(nextT<ac.currentTime)nextT=ac.currentTime+0.05;
  while(nextT<ac.currentTime+0.15){
    if(SET.music){
      const li=step%song.lead.length,bi=step%song.bass.length,a=song.lead[li],b=song.bass[bi];
      if(a!=='.'&&a!=='-')tone(freq(a),nextT,sp*(held_(song.lead,li)-0.2),song.wave||'square',song.wave==='sawtooth'?0.018:song.wave==='triangle'?0.05:0.022,true);
      if(b!=='.'&&b!=='-')tone(freq(b),nextT,sp*(held_(song.bass,bi)-0.05),'triangle',0.07);
      if(song.arp){const c=song.arp[step%song.arp.length];if(c!=='.'&&c!=='-')tone(freq(c),nextT,sp*0.9,'square',0.008)}
      if(song.drum){const d=song.drum[step%song.drum.length];if(d!=='.')drum(d,nextT)}
    }
    step++;nextT+=sp;
  }
},25);
function held_(trk,i){let n=1;while(n<trk.length&&trk[(i+n)%trk.length]==='-')n++;return n}
let noiseBuf=null;
function drum(k,t){
  if(k==='k'){
    const o=ac.createOscillator(),g=ac.createGain();o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(40,t+0.12);
    g.gain.setValueAtTime(0.18,t);g.gain.exponentialRampToValueAtTime(0.0001,t+0.15);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+0.16);return;
  }
  if(!noiseBuf){noiseBuf=ac.createBuffer(1,ac.sampleRate*0.2,ac.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}
  const s=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain(),len=k==='s'?0.12:0.03;
  s.buffer=noiseBuf;f.type='highpass';f.frequency.value=k==='s'?1200:7000;
  g.gain.setValueAtTime(k==='s'?0.09:0.03,t);g.gain.exponentialRampToValueAtTime(0.0001,t+len);
  s.connect(f).connect(g).connect(ac.destination);s.start(t);s.stop(t+len+0.01);
}

// ---------- game data ----------
// five types; each overpowers the next one and the one three steps on:
// 불>풀,쇠 · 풀>물,달 · 물>쇠,불 · 쇠>달,풀 · 달>불,물  (불>풀>물>불 is the familiar triangle)
const TYPES=['불','풀','물','쇠','달'];
const TCOL={불:'#ff9440',풀:'#6cc65a',물:'#58a8f0',달:'#b49aff',쇠:'#a8b4c4',보통:'#d8d0c0'};
const beats=(a,d)=>{const i=TYPES.indexOf(a),j=TYPES.indexOf(d);return i>=0&&j>=0&&((j-i+5)%5===1||(j-i+5)%5===3)};
const eff=(a,d)=>beats(a,d)?1.5:beats(d,a)?0.6:1;
console.assert(TYPES.every(a=>TYPES.filter(d=>beats(a,d)).length===2&&TYPES.filter(d=>beats(d,a)).length===2),'type chart');
console.assert(beats('불','풀')&&beats('풀','물')&&beats('물','불'),'starter triangle');

const MV={
  tackle:{n:'들이받기',t:'보통',p:40,a:100},slam:{n:'몸던지기',t:'보통',p:55,a:90},
  glare:{n:'기선제압',t:'보통',a:100,fx:['foe','atk',-1]},brace:{n:'자세 다잡기',t:'보통',fx:['self','def',1]},
  rally:{n:'기세 올리기',t:'보통',fx:['self','atk',1]},rest:{n:'숨고르기',t:'보통',heal:0.4},
  spark:{n:'불티',t:'불',p:40,a:100},sunspear:{n:'불꽃창',t:'불',p:65,a:95},noon:{n:'정오의 열기',t:'불',p:90,a:85},
  spray:{n:'물보라',t:'물',p:40,a:100},mistblade:{n:'물살베기',t:'물',p:65,a:95},surge:{n:'밀물 해일',t:'물',p:90,a:85},
  needle:{n:'솔잎침',t:'풀',p:40,a:100},thorn:{n:'가시뿌리',t:'풀',p:65,a:95},echo:{n:'숲울림',t:'풀',p:90,a:85},
  shade:{n:'달그늘',t:'달',p:40,a:100},crescent:{n:'초승달베기',t:'달',p:65,a:95},fullmoon:{n:'만월파동',t:'달',p:90,a:85},
  filings:{n:'쇳가루',t:'쇠',p:40,a:100},hammer:{n:'쇠망치',t:'쇠',p:65,a:95},forge:{n:'대장간 일격',t:'쇠',p:90,a:85},
  bleach:{n:'탈색의 빛',t:'보통',p:80,a:90},
};
const LS={
  sun:[[1,'tackle'],[1,'glare'],[5,'spark'],[9,'brace'],[12,'sunspear'],[16,'noon']],
  mist:[[1,'tackle'],[1,'glare'],[5,'spray'],[9,'rest'],[12,'mistblade'],[16,'surge']],
  grove:[[1,'tackle'],[1,'brace'],[5,'needle'],[9,'rest'],[12,'thorn'],[16,'echo']],
  moon:[[1,'tackle'],[3,'shade'],[7,'glare'],[10,'crescent'],[15,'fullmoon']],
  iron:[[1,'tackle'],[1,'brace'],[5,'filings'],[9,'slam'],[12,'hammer'],[16,'forge']],
  reed:[[1,'tackle'],[4,'needle'],[8,'rally'],[12,'thorn'],[17,'echo']],
  newt:[[1,'tackle'],[4,'spray'],[8,'glare'],[12,'mistblade'],[17,'surge']],
  fly:[[1,'tackle'],[3,'spark'],[7,'rally'],[11,'sunspear'],[16,'shade']],
  ray:[[1,'tackle'],[1,'brace'],[1,'spark'],[1,'sunspear']],
  king:[[1,'bleach'],[1,'crescent'],[1,'rest'],[1,'fullmoon']],
};
// b: [hp, atk, def, spd]; y: exp yield; cr: how easily a thread holds it

const stat=(m,i)=>i===0?Math.floor(SP[m.sp].b[0]*m.lv/20)+m.lv+12:Math.floor(SP[m.sp].b[i]*m.lv/25)+5;
const maxhp=m=>stat(m,0);
const need=lv=>lv*10;
const nm=m=>SP[m.sp].n;
function makeMon(sp,lv){
  const m={sp,lv,exp:0,moves:[]};
  for(const [l,id] of SP[sp].ls)if(l<=lv&&!m.moves.includes(id))m.moves.push(id);
  m.moves=m.moves.slice(-4);m.hp=maxhp(m);return m;
}
// battle dice; a link battle swaps in a seeded one so both players roll the same numbers
let rnd=Math.random;
const seeded=s=>()=>{s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
{const a=seeded(7),b=seeded(7);console.assert(a()===b()&&a()===b()&&a()!==seeded(8)(),'seeded rng')}
const stg=s=>s>=0?1+s*0.25:1/(1-s*0.25);
function dmg(a,d,mv,as,ds){
  const A=stat(a,1)*stg(as.atk),D=stat(d,2)*stg(ds.def),e=eff(mv.t,SP[d.sp].t),stab=mv.t===SP[a.sp].t?1.2:1,crit=rnd()<1/16?1.5:1;
  return {n:Math.max(1,Math.floor(mv.p*A/D*(a.lv+10)/80*e*stab*crit*(0.85+rnd()*0.15))+1),e,crit:crit>1};
}
{ // self-check: an even lv5 fight takes a handful of hits, not one or twenty

}

// ---------- sprites ----------
function sprite(w,h,draw){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'));return c}
function pixelSprite(rows,pal){
  console.assert(rows.every(r=>r.length===rows[0].length),'sprite rows',rows[0]);
  return sprite(rows[0].length,rows.length,g=>rows.forEach((row,y)=>[...row].forEach((ch,x)=>{if(pal[ch]){g.fillStyle=pal[ch];g.fillRect(x,y,1,1)}})));
}
// people: chibi walkers drawn on a 16x24 body (18x26 with the dark rim), 3 frames per facing
// (stand, left step, right step); facing right is facing left mirrored
function rim(c){return sprite(c.width,c.height,g=>{
  for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]])g.drawImage(c,dx,dy);
  g.globalCompositeOperation='source-in';g.fillStyle='#202030';g.fillRect(0,0,c.width,c.height);g.globalCompositeOperation='source-over';g.drawImage(c,0,0);
})}
function person(o){
  const {skin='#f8d0a8',hair='#4a3020',top='#3878d0',bottom='#384058',hat=null,brim=null,shoe='#383848',extra=null}=o;
  const shade=top==='#f8f8f8'?'#d0d0d8':'rgba(0,0,0,.18)';
  const mk=(dir,step)=>rim(sprite(18,26,g=>{
    g.translate(1,1);const F=(col,x,y,w,h)=>{g.fillStyle=col;g.fillRect(x,y,w,h)};
    if(dir==='left'){
      // legs: together when standing, scissored mid-step
      F(bottom,6,16,5,2);
      if(!step){F(bottom,6,18,4,3);F(shoe,5,21,5,1)}
      else{const a=step===1;F(bottom,a?3:4,18,3,3);F(shoe,a?2:3,21,4,1);F(bottom,a?8:7,18,3,3);F(shoe,a?8:7,21,3,1)}
      F(top,5,10,6,6);F(shade,5,15,6,1);
      F(top,7,11,3,4);F(shade,7,11,1,4);F(skin,7+(step===1?-1:step===2?1:0),15,3,1);
      F(skin,4,3,7,7);F(hair,4,1,9,3);F(hair,10,3,3,6);F(hair,9,3,1,2);
      F('#202030',5,6,1,2);F('#e8a088',4,9,2,1);
      if(hat){F(hat,4,0,9,3);F(brim||hat,2,3,6,1)}
    }else{
      const up=dir==='up';
      F(bottom,4,16,8,2);
      const ll=step===1?2:3,rl=step===2?2:3;
      F(bottom,4,18,3,ll);F(shoe,4,18+ll,3,1);F(bottom,9,18,3,rl);F(shoe,9,18+rl,3,1);
      F(top,4,10,8,6);F(shade,4,15,8,1);
      F(top,2,11,2,4);F(top,12,11,2,4);F(skin,2,15+(step===2?1:0),2,1);F(skin,12,15+(step===1?1:0),2,1);
      if(up){F(hair,3,1,10,8);F(skin,5,9,6,1)}
      else{F(skin,4,3,8,7);F(hair,3,1,10,3);F(hair,3,4,1,4);F(hair,12,4,1,4);F(hair,4,4,8,1);F('#202030',6,6,1,2);F('#202030',9,6,1,2);F('#f0a090',5,8,1,1);F('#f0a090',10,8,1,1)}
      if(hat){F(hat,3,0,10,3);if(!up)F(brim||hat,2,3,12,1)}
    }
    if(extra)extra(F,dir,step);
  }));
  const set=dir=>[0,1,2].map(s=>mk(dir,s));
  return {down:set('down'),up:set('up'),left:set('left')};
}
// draw a walker standing on tile (x,y); feet land on the tile's bottom row
function drawPerson(g,P,face,frame,x,y){
  const img=(face==='right'?P.left:P[face])[frame];
  g.save();g.translate(Math.round(x)+(face==='right'?17:-1),Math.round(y)-8);if(face==='right')g.scale(-1,1);g.drawImage(img,0,0);g.restore();
}

class Typer{
  constructor(text,voice='blip'){this.text=text;this.n=0;this.voice=voice}
  update(dt){
    if(this.done)return;const before=Math.floor(this.n);this.n=Math.min(this.text.length,this.n+dt*42);
    const now=Math.floor(this.n);if(now!==before&&now%2===0&&this.text[now-1]!==' ')SFX[this.voice]();
  }
  get done(){return this.n>=this.text.length}
  skip(){this.n=this.text.length}
  get shown(){return this.text.slice(0,Math.floor(this.n))}
}

class Menu{
  constructor(o){Object.assign(this,{sel:0,top:0,cols:1,rowH:34,size:20,x:420,y:40,w:200,frame:true},o);
    if(!this.h)this.h=Math.ceil(this.items.length/this.cols)*this.rowH+28+(this.title?34:0)}
  get rows(){return Math.max(1,Math.floor((this.h-28-(this.title?34:0))/this.rowH))}
  upd(){
    const n=this.items.length,c=this.cols;
    const d=(hit('up')?-c:0)+(hit('down')?c:0)+(c>1?(hit('left')?-1:0)+(hit('right')?1:0):0);
    if(d&&n){let s=this.sel+d;if(c===1)s=(s+n)%n;if(s>=0&&s<n&&s!==this.sel){this.sel=s;SFX.move()}}
    const r=Math.floor(this.sel/c);if(r<this.top)this.top=r;if(r>=this.top+this.rows)this.top=r-this.rows+1;
    if(hit('ok')&&n){const it=this.items[this.sel];if(it&&it.dis){SFX.no();return}SFX.ok();this.onPick(this.sel)}
    else if(hit('back')&&this.onBack){SFX.back();this.onBack()}
  }
  draw(){
    if(this.frame)box(this.x,this.y,this.w,this.h);
    const y0=this.y+14+(this.title?34:0),cw=(this.w-24)/this.cols;
    if(this.title)text(this.title,this.x+20,this.y+14,20,HI);
    if(!this.items.length&&this.empty)text(this.empty,this.x+28,y0,18,DIM);
    for(let k=0;k<this.rows*this.cols;k++){
      const i=this.top*this.cols+k;if(i>=this.items.length)break;
      const x=this.x+34+(i%this.cols)*cw,y=y0+(Math.floor(i/this.cols)-this.top)*this.rowH,it=this.items[i],on=i===this.sel;
      if(this.drawRow)this.drawRow(it,i,x,y,on);
      else{text(typeof it==='string'?it:it.label,x,y,this.size,it.dis?'#a8a8b4':INK);if(it.right)text(it.right,this.x+this.w-22,y,this.size,INK,'right')}
      if(on)cursor(x-20,y+this.size/2+1);
    }
    if(this.top>0)text('▲',this.x+this.w-30,this.y+10,14,RED);
    if((this.top+this.rows)*this.cols<this.items.length)text('▼',this.x+this.w-30,this.y+this.h-26,14,RED);
    if(this.side)this.side(this);
  }
}

// ---------- script queue: messages, waits and steps run in order (map talk and battle alike) ----------
const Q=[];
const toStep=l=>typeof l==='string'?{text:l}:Array.isArray(l)?{name:l[0],text:l[1]}:l;
const say=(...ls)=>Q.push(...ls.map(toStep));
const now=(...ls)=>Q.unshift(...ls.map(toStep));
const ask=(name,text,opts,cb,noBack)=>Q.push({name,text,opts,cb,noBack});
function runQ(dt){
  while(Q.length&&!UI.length){
    const s=Q[0];
    if(typeof s==='function'){Q.shift();s();continue}
    if(s.wait!==undefined){s.wait-=dt;if(s.wait<=0)Q.shift();return}
    if(s.until){if(s.until()){Q.shift();continue}return}
    if(!s.ty)s.ty=new Typer(wrapText(s.text,560,22),VOICE[s.name]||'blip');
    s.ty.update(dt);
    if(s.ty.done&&s.opts){
      const n=s.opts.length;
      open(new Menu({items:s.opts,x:400,y:316-(n*34+28),w:220,onPick:i=>{close();Q.shift();s.cb(i)},onBack:s.noBack?null:()=>{close();Q.shift();s.cb(n-1)}}));
      return;
    }
    if(s.auto&&s.ty.done&&(s.at=(s.at||0)+dt)>1.1){Q.shift();continue}
    if(hit('ok')||hit('back')){pressed.clear();if(!s.ty.done)s.ty.skip();else Q.shift()}
    return;
  }
}

  G.face=d;const [dc,dr]=DIRS[d],nr=G.r+dr,nc=G.c+dc,mp=MAPS[G.map],t=tileAt(nr,nc);
  if(t===null){
    if(nr<0&&mp.north!=null){
      if(G.map===0&&!G.F.starter){say(['윤슬','잠깐! 동료도 없이 풀숲에 들어가면 위험하다. 이리 오너라.']);return}
      changeMap(mp.north,MAPS[mp.north].rows.length-1,G.c);
    }else if(nr>=mp.rows.length&&mp.south!=null)changeMap(mp.south,0,G.c);
    return;
  }
  if(t==='D'){door(nr,nc);return}
  if(SOLID.includes(t)||npcAt(nr,nc)){if(hit(d))SFX.bump();return}
  M.moving=true;M.t=0;M.dr=dr;M.dc=dc;M.step=(M.step||0)+1;sendPos();
}
function arrive(){
  const t=tileAt(G.r,G.c),mp=MAPS[G.map];
  if(t==='E'){changeMap(3,5,15,'down');return}
  if(checkTrainers())return;
  if(t==='g'&&mp.enc&&G.party.some(m=>m.hp>0)&&Math.random()<0.1){
    const tot=mp.enc.reduce((a,e)=>a+e[3],0);let r=Math.random()*tot,e=mp.enc[0];
    for(const x of mp.enc){if((r-=x[3])<0){e=x;break}}
    const lv=e[1]+Math.floor(Math.random()*(e[2]-e[1]+1));
    Q.push(()=>{SFX.enc();M.flashAt=T},{wait:0.6},()=>startBattle([makeMon(e[0],lv)],null));
  }
}
function checkTrainers(){
  for(const n of npcs(G.map)){
    if(!n.party||G.F.beat[n.id])continue;
    const [dc,dr]=DIRS[n.face];
    for(let k=1;k<=4;k++){
      const r=n.r+dr*k,c=n.c+dc*k;
      if(r===G.r&&c===G.c){G.face=OPP[n.face];challenge(n);return true}
      const t=tileAt(r,c);if(t===null||SOLID.includes(t)||npcAt(r,c))break;
    }
  }
  return false;
}
function challenge(n){
  Q.push(()=>{n.alert=true;SFX.alert()},{wait:0.7},()=>{n.alert=false},...n.pre.map(toStep),
    ()=>startBattle((typeof n.party==='function'?n.party():n.party).map(([s,l])=>makeMon(s,l)),n));
}
function interact(){
  const [dc,dr]=DIRS[G.face],r=G.r+dr,c=G.c+dc,n=npcAt(r,c),t=tileAt(r,c),pe=peerAt(r,c);
  if(pe){peerMenu(pe);return}
  if(n){
    n.face=OPP[G.face];
    if(n.party&&!G.F.beat[n.id])challenge(n);
    else if(n.party)say([n.name,n.after]);
    else if(n.talk)n.talk();
    else say(...n.lines);
    return;
  }
  const sg=SIGNS[`${G.map}:${r}:${c}`];
  if(sg){say(sg);return}
  if(t==='D')door(r,c);
  else if(t==='~')say('잔잔한 물결이 일렁인다.');
  else if(t==='G')say(G.F.badge?'커다란 등불이 바다를 향해 빛을 뿜고 있다.':'커다란 등불이 차갑게 식어 있다.');
}
function door(r,c){
  const k=DOORS[`${G.map}:${r}:${c}`];
  if(k==='home')say('집이다. 잠시 숨을 돌렸다.',()=>{healAll();G.lastHeal={m:G.map,r:r+1,c};SFX.heal()},'동료들이 기운을 되찾았다.');
  else if(k==='lab')say('기록관 문이 잠겨 있다. 윤슬 선생님은 바깥에 계신다.');
  else if(k==='heal')healDesk(r,c);
  else if(k==='shop')openShop();
  else if(k==='tower')changeMap(4,13,8,'up');
}
function healDesk(r,c){
  ask('쉼터지기','어서 와요. 무엇을 도와드릴까요?',['동료 쉬게 하기','동료 맡기기','맡긴 동료 데려가기','그만두기'],i=>{
    if(i===0)now(()=>{healAll();G.lastHeal={m:G.map,r:r+1,c};jingle(['C5','E5','G5','E5','C6'],0.12)},{wait:0.8},['쉼터지기','모두 푹 쉬었어요. 쓰러지면 이곳으로 모셔 올게요.']);
    else if(i===1){
      if(G.party.length<=1)now(['쉼터지기','함께 다닐 동료가 한 명은 있어야 해요.']);
      else open(partyMenu({title:'맡길 동료를 고르세요',onPick:j=>{close();const m=G.party.splice(j,1)[0];G.box.push(m);now(['쉼터지기',`${jo(nm(m),'을','를')} 잘 맡아 둘게요.`])},onBack:close}));
    }else if(i===2){
      if(!G.box.length)now(['쉼터지기','맡겨 둔 동료가 없어요.']);
      else if(G.party.length>=6)now(['쉼터지기','지금 데리고 있는 동료가 너무 많아요. 먼저 한 명을 맡겨 주세요.']);
      else open(partyMenu({title:'데려갈 동료를 고르세요',list:G.box,onPick:j=>{close();const m=G.box.splice(j,1)[0];G.party.push(m);now(['쉼터지기',`${jo(nm(m),'이','가')} 반가워하네요.`])},onBack:close}));

function updMap(dt){
  G.time+=dt;
  if(M.moving){M.t+=dt*7;if(M.t>=1){M.moving=false;G.r+=M.dr;G.c+=M.dc;arrive()}return}
  if(hit('menu')){SFX.ok();mainMenu();return}
  if(hit('ok')){interact();return}
  for(const d of ['up','down','left','right'])if(held[d]){tryMove(d);break}
}

      if((T*2+h*0.37)%3<0.6)F('#ffffff',3+h%9,3+(h*5)%10,1,1);

const PLATES={heal:'#4aa88a',shop:'#e0903a',lab:'#4a6ab0'};
function drawMap(){
  const mp=MAPS[G.map],R=mp.rows,g=lg;
  const px=(G.c+(M.moving?M.dc*M.t:0))*TS,py=(G.r+(M.moving?M.dr*M.t:0))*TS;
  cam={x:clamp(px+8-160,0,20*TS-320),y:clamp(py+8-120,0,R.length*TS-240)};
  g.save();g.translate(-Math.round(cam.x),-Math.round(cam.y));
  const r0=Math.floor(cam.y/TS);
  for(let r=r0;r<Math.min(R.length,r0+16);r++)for(let c=0;c<20;c++)drawTile(g,R[r][c],c*TS,r*TS,r,c,R);
  for(const k in DOORS){
    const [m,r,c]=k.split(':').map(Number),kind=DOORS[k];if(m!==G.map||!PLATES[kind])continue;
    const x=c*TS,y=(r-1)*TS;g.fillStyle='#3a2a1a';g.fillRect(x+2,y+3,12,9);g.fillStyle=PLATES[kind];g.fillRect(x+3,y+4,10,7);g.fillStyle='#fff';
    if(kind==='heal'){g.fillRect(x+7,y+5,2,5);g.fillRect(x+5,y+6,6,2)}else if(kind==='shop'){g.fillRect(x+6,y+5,4,5);g.fillStyle=PLATES.shop;g.fillRect(x+7,y+6,2,3)}else{g.fillRect(x+5,y+5,6,5);g.fillStyle=PLATES.lab;g.fillRect(x+8,y+5,1,5)}
  }
  const ents=[];
  for(let r=r0;r<Math.min(R.length,r0+17);r++)for(let c=0;c<20;c++)if(R[r][c]==='T')ents.push({y:r,draw:()=>g.drawImage(TREE,c*TS,r*TS-2)});
  ents.push(...npcs(G.map).map((n,i)=>({y:n.r,draw:()=>{
    const x=n.c*TS,y=n.r*TS;
    g.fillStyle='rgba(0,0,0,.22)';g.fillRect(x+3,y+13,10,3);
    if(n.mon){drawMonAt(n.mon,x+8,y+16+Math.round(Math.sin(T*2)),0.75,{g,seed:7});return}
    drawPerson(g,LOOK[n.look],n.face,0,x,y);
    if(n.alert){g.fillStyle='#202030';g.fillRect(x+3,y-23,10,13);g.fillStyle='#fff';g.fillRect(x+4,y-22,8,11);g.fillStyle='#e04040';g.fillRect(x+7,y-20,2,5);g.fillRect(x+7,y-14,2,2)}
  }})));
  ents.push({y:py/TS,draw:()=>{
    g.fillStyle='rgba(0,0,0,.22)';g.fillRect(px+3,py+13,10,3);
    drawPerson(g,LOOK.player,G.face,M.moving&&M.t>0.2&&M.t<0.8?1+M.step%2:0,px,py);
  }});
  const peers=Object.values(NET.peers).filter(p=>p.m===G.map);
  for(const p of peers){
    p.x+=(p.c*TS-p.x)*0.25;p.y+=(p.r*TS-p.y)*0.25;
    const walking=Math.abs(p.c*TS-p.x)+Math.abs(p.r*TS-p.y)>1;
    ents.push({y:p.y/TS,draw:()=>{g.fillStyle='rgba(0,0,0,.22)';g.fillRect(Math.round(p.x)+3,Math.round(p.y)+13,10,3);drawPerson(g,p.look,p.f,walking?1+(T*7|0)%2:0,p.x,p.y)}});
  }
  ents.sort((a,b)=>a.y-b.y).forEach(e=>e.draw());
  g.restore();
  if(mp.mist)for(let i=0;i<6;i++){g.fillStyle='rgba(225,232,245,.13)';const x=((T*8+i*90)%440)-60,y=20+i*38+Math.sin(T*0.7+i)*8;g.beginPath();g.ellipse(x,y,70,14,0,0,7);g.fill()}
  if(G.map===4&&!G.F.badge){g.fillStyle='rgba(10,10,30,.25)';g.fillRect(0,0,320,240)}
  ctx.imageSmoothingEnabled=false;ctx.drawImage(low,0,0,W,H);
  for(const p of peers){ // name tags at full resolution so the text stays sharp
    ctx.font=`700 13px ${FONT}`;const w=ctx.measureText(p.name).width+12,x=Math.round((p.x+8-cam.x)*2),y=Math.round((p.y-cam.y)*2)-34;

  if(M.banner>0){ // wooden area plaque sliding down from the top
    M.banner-=1/60;const yy=Math.round(-60*Math.max(0,M.banner-2.1)/0.3-60*Math.max(0,0.3-M.banner)/0.3)+12;

    text(mp.name,131,yy+12,22,'#fff8e8','center');
  }
}

async function netConnect(){
  if(NET.lbc||NET.bc)return;
  if(location.hash==='#local'){
    const bc=new BroadcastChannel('deulpul-net');NET.bc=bc;NET.me=1+Math.floor(Math.random()*1e9);
    bc.onmessage=e=>{const x=e.data;if(x&&x.from!==NET.me&&(!x.to||x.to===NET.me))netEvent(x.c,x.d,x.from)};
    NET.send=(c,d,to)=>bc.postMessage({c,d,from:NET.me,to});NET.on=true;NET.status='로컬 테스트';sendPos();return;
  }

function netAbort(nr){

const peerAt=(r,c)=>Object.values(NET.peers).find(p=>p.m===G.map&&p.r===r&&p.c===c);
const busy=()=>scene!=='map'||Q.length||UI.length||M.moving||NET.req||NET.trade||!G.party.length;
function netEvent(c,d,from){
  if(!G||scene==='title'||!d||typeof d!=='object')return;
  if(c===EV.POS){
    if(!MAPS[d.m]||!Number.isInteger(d.r)||!Number.isInteger(d.c)||!DIRS[d.f])return;
    const p=NET.peers[from]||(NET.peers[from]={nr:from,look:PEER_LOOKS[from%PEER_LOOKS.length]});
    if(p.m!==d.m){p.x=d.c*TS;p.y=d.r*TS}
    Object.assign(p,{name:String(d.n||'기록원').slice(0,8),m:d.m,r:d.r,c:d.c,f:d.f,last:T});
    if(!p.seen){p.seen=true;sendPos()} // say hello back so newcomers see us right away
    return;
  }

  if(c===EV.REQ){

    ask(pe.name,`${jo(pe.name,'이','가')} ${kind==='battle'?'대전':'동료 교환'}을 신청했다.`,['받는다','거절한다'],i=>{
      if(!NET.peers[from]){now('상대가 떠나 버렸다.');return}
      const ok=i===0;NET.send(EV.ANS,{nonce:d.nonce,ok,party:ok&&kind==='battle'?G.party.map(cleanMon):null},from);
      if(ok)kind==='battle'?startPvp(from,party,d.nonce,NET.me<from):startTrade(from);
    });
  }else if(c===EV.ANS){
    const r=NET.req;
    if(r&&r.peer===from&&r.nonce===d.nonce&&!r.ans)r.ans={ok:!!d.ok&&(r.kind!=='battle'||!!cleanParty(d.party)),busy:d.busy,party:cleanParty(d.party)};
    else if(d.ok)NET.send(EV.CANCEL,{},from); // we had already given up waiting
  }else if(c===EV.ACT){
    const a=d.a;if(!a)return;
    if(!(B&&B.pvp&&B.pvp.peer===from)){NET.early={from,d};return}
    if(B.over)return;
    if(a.k==='run'){B.over=true;Q.length=0;UI.length=0;now(`${jo(pe.name,'이','가')} 승부를 포기했다.`,`${pe.name}에게 이겼다!`,()=>endBattle('pvp'));return}
    const ok=a.k==='move'?foe().moves.includes(a.id):a.k==='switch'&&B.foes[a.i]&&B.foes[a.i].hp>0&&a.i!==B.fi;
    if(!ok){netAbort(from);return}
    if(d.t===B.pvp.turn)B.pvp.theirs=a;
  }else if(c===EV.OFFER){
    const t=NET.trade;if(t&&t.peer===from)t.theirs=cleanMon(d.mon);
  }else if(c===EV.OK){
    const t=NET.trade;if(!t||t.peer!==from)return;
    if(!d.ok){NET.trade=null;UI.length=0;toast('상대가 교환을 그만두었다.')}else t.theirOk=true;
  }else if(c===EV.CANCEL)netAbort(from);
}

// link battle: both players run the same turns with the same seeded dice; full-HP copies, nothing carries over
function startPvp(peer,theirs,seed,host){
  const pe=NET.peers[peer];if(!pe)return;
  rnd=seeded(seed);
  startBattle(theirs,{name:pe.name,cls:'기록원',pvp:true,id:'pvp',lookSpr:pe.look},G.party.map(cleanMon));
  B.pvp={peer,turn:0,mine:null,theirs:null,host};
  if(NET.early&&NET.early.from===peer&&NET.early.d.t===0)B.pvp.theirs=NET.early.d.a;
  NET.early=null;
}
function pvpChoose(a){
  const P=B.pvp;
  if(a.k==='run'){NET.send(EV.ACT,{t:P.turn,a:{k:'run'}},P.peer);B.over=true;now('승부를 포기했다.',()=>endBattle('pvp'));return}
  P.mine=a;NET.send(EV.ACT,{t:P.turn,a},P.peer);
  now({until:()=>B.over||P.theirs,note:'상대의 선택을 기다리는 중'},()=>{if(!B.over)pvpResolve()});
}
function pvpResolve(){
  const P=B.pvp,a=P.mine,b=P.theirs,order=P.host?[1,0]:[0,1];P.mine=P.theirs=null;P.turn++;
  const steps=[];
  for(const s of order){const x=s?a:b;if(x.k==='switch')steps.push(s?()=>now(...sendOut(a.i,true)):()=>now(...foeSwap(b.i)))}
  steps.push(()=>{
    const moves=[];if(a.k==='move')moves.push([1,pl(),a.id]);if(b.k==='move')moves.push([0,foe(),b.id]);
    // faster goes first; ties go to the host on both screens
    moves.sort((x,y)=>stat(y[1],3)-stat(x[1],3)||order.indexOf(x[0])-order.indexOf(y[0]));
    now(...moves.map(([s,m,id])=>attackStep(s,m,id)));
  },()=>{if(!B.over)turnMenu()});
  now(...steps);
}
function foeSwap(i){
  return [{text:`${jo(B.tr.name,'은','는')} ${jo(nm(foe()),'을','를')} 불러들였다.`,auto:1},()=>{B.foeVis=false},
    ()=>{B.fi=i;B.st[0]={atk:0,def:0};B.dhp[0]=foe().hp;see(foe().sp);B.foeVis=true;B.foeX=240;B.anim.faint0=null;SFX.pop();
      now({text:`${jo(B.tr.name,'은','는')} ${jo(nm(foe()),'을','를')} 내보냈다!`,auto:1})}].map(toStep);

// trade: each picks one, both confirm, then each side swaps its own copy
function startTrade(peer){
  const t=NET.trade={peer,myI:null,theirs:null,theirOk:false};
  open(partyMenu({title:'교환할 동료를 고르세요',onBack:()=>{close();tradeCancel()},onPick:i=>{
    close();if(NET.trade!==t)return;
    t.myI=i;NET.send(EV.OFFER,{mon:cleanMon(G.party[i])},peer);
    now({until:()=>NET.trade!==t||t.theirs,note:'상대가 고르기를 기다리는 중'},()=>{
      if(NET.trade!==t)return;
      ask('',`${jo(nm(G.party[t.myI]),'을','를')} 보내고 ${jo(nm(t.theirs),'을','를')} 받을까?`,['교환한다','그만둔다'],j=>{
        if(NET.trade!==t)return;
        if(j){tradeCancel();return}
        NET.send(EV.OK,{ok:true},peer);
        now({until:()=>NET.trade!==t||t.theirOk,note:'상대의 확인을 기다리는 중'},()=>{
          if(NET.trade!==t)return;NET.trade=null;
          const gave=G.party[t.myI],got=t.theirs;G.party[t.myI]=got;own(got.sp);saveGame(true);
          now(()=>jingle(['C5','E5','G5','C6'],0.12),`${jo(nm(gave),'을','를')} 보내고 ${jo(nm(got),'을','를')} 받았다!`);
        });
      });
    });
  }}));
}
function tradeCancel(){const t=NET.trade;if(!t)return;NET.trade=null;NET.send(EV.OK,{ok:false},t.peer);now('교환을 그만두었다.')}

// ---------- evolution / title / ending ----------
function drawEvo(){
  ctx.fillStyle='#05050c';ctx.fillRect(0,0,W,H);
  for(let i=0;i<24;i++){const a=i/24*6.28+T*0.4,d=(EVO.t*120+i*30)%320;ctx.fillStyle=`rgba(255,240,180,${0.6-d/600})`;ctx.fillRect(W/2+Math.cos(a)*d,200+Math.sin(a)*d*0.7,3,3)}
  if(EVO.done)drawMonAt(EVO.to,W/2,280,5,{seed:1});
  else{const sp=Math.max(0.08,0.5-EVO.t*0.14),show=(EVO.t/sp|0)%2?EVO.to:EVO.from;drawMonAt(show,W/2,280,5,{seed:1,tint:'#fff8e0'})}
}
function lighthouseScene(lit){
  const gr=ctx.createLinearGradient(0,0,0,H);gr.addColorStop(0,'#070a1e');gr.addColorStop(1,'#1a2a4a');ctx.fillStyle=gr;ctx.fillRect(0,0,W,H);
  for(let i=0;i<60;i++){const x=(i*97)%W,y=(i*53)%300;if((T*1.5+i*0.37)%4<3.4){ctx.fillStyle=i%5?'#9fb8ff':'#fff';ctx.fillRect(x,y,i%7?1:2,i%7?1:2)}}
  ctx.fillStyle='#0d1a34';ctx.fillRect(0,360,W,120);
  for(let i=0;i<14;i++){ctx.fillStyle='rgba(120,160,230,.25)';ctx.fillRect((i*71+T*12)%W,372+(i*29)%100,24,2)}
  ctx.fillStyle='#14182a';ctx.beginPath();ctx.moveTo(380,360);ctx.lineTo(560,360);ctx.lineTo(540,330);ctx.lineTo(400,335);ctx.fill();
  const x=470;
  if(lit){const a=Math.sin(T*0.9)*1.2;ctx.save();ctx.translate(x,150);ctx.rotate(a);const bg=ctx.createLinearGradient(0,0,-420,0);bg.addColorStop(0,'rgba(255,240,160,.55)');bg.addColorStop(1,'rgba(255,240,160,0)');ctx.fillStyle=bg;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(-460,-60);ctx.lineTo(-460,60);ctx.fill();ctx.restore()}
  for(let i=0;i<6;i++){ctx.fillStyle=i%2?'#d84a3a':'#f4f0e8';const y0=180+i*26,w0=28+i*3;ctx.fillRect(x-w0,y0,w0*2,26)}
  ctx.fillStyle='#3a3a4a';ctx.fillRect(x-30,140,60,40);ctx.fillStyle=lit?'#ffe14d':'#4a5060';ctx.fillRect(x-22,148,44,26);
  ctx.fillStyle='#c84a3a';ctx.beginPath();ctx.moveTo(x-36,140);ctx.lineTo(x,112);ctx.lineTo(x+36,140);ctx.fill();
}
let titleSel=0;
function updTitle(){
  const has=!!SAVED,n=2;
  if(hit('up')||hit('down')){titleSel=(titleSel+1)%n;SFX.move()}
  if(hit('ok')){
    if(titleSel===1&&!has){SFX.no();return}
    SFX.ok();
    if(titleSel===1){G=SAVED;scene='map';changeMap(G.map,G.r,G.c);M.banner=2.4}
    else{G=newGame();scene='map';changeMap(0,5,3,'down');askName(()=>
      say('바닷바람이 닿는 작은 마을, 새벽마을.','이 고장 사람들은 들에 사는 생물과 인연을 맺고 함께 길을 걷는다.',`오늘은 ${G.name}, 네가 동행 기록원으로 첫발을 떼는 날이다.`,'기록관 앞에서 윤슬 선생님이 기다리고 있다. (방향키로 걷고, Z로 말을 건다)'))}
  }
}
function drawTitle(){
  lighthouseScene(true);
  ctx.fillStyle='#1a2a1a';ctx.beginPath();ctx.ellipse(160,400,260,70,0,0,7);ctx.fill();
  STARTERS.forEach((sp,i)=>drawMonAt(sp,80+i*90,372-(i===1?8:0),2,{seed:i*1.3}));
  text('들풀 동행기',40,60,56,'#ffe14d');text('— 꺼진 등대를 다시 켜는 여행 —',44,134,18,'#c8c4d8');
  const has=!!SAVED;
  ['처음부터','이어서'].forEach((s,i)=>{text(s,90,208+i*40,24,i===1&&!has?'#555':i===titleSel?'#ffe14d':'#fff');if(i===titleSel)cursor(66,220+i*40,'#ffe14d')});
  text('Z / Enter 결정 · ↑↓ 선택',40,452,14,'#8a84a3');text('v'+GAME_VERSION,600,452,14,'#8a84a3','right');
}
function startEnding(){scene='ending';END={t:0};playMusic('town');END.saved=saveGame(true)}
function drawEnding(){
  lighthouseScene(true);END.t+=1/60;
  const lines=['등대에 다시 불이 켜졌다.','밤바다 위로 긴 빛줄기가 뻗어 나간다.',`기록첩 — 본 것 ${G.seen.length} · 함께한 것 ${G.caught.length} / ${DEX.length}`,`여정 시간 ${fmtTime(G.time)}`,'들풀 동행기 · 끝'];
  lines.forEach((l,i)=>{const a=clamp(END.t-i*0.9,0,1);ctx.globalAlpha=a;text(l,40,60+i*40,i===4?30:20,i===4?'#ffe14d':'#fff');ctx.globalAlpha=1});
  if(END.t>5&&(T*2|0)%2)text('Z를 누르면 여행을 계속할 수 있다.'+(END.saved?' (진행은 자동으로 기록되었다)':''),40,440,16,'#c8c4d8');
}
function updEnding(){if(END.t>5&&hit('ok')){scene='map';playMusic(MAPS[G.map].music);say(['하람',NPCS[4][2].after],'…창밖으로 보이는 포구의 부두 끝에서, 희미한 빛이 일렁인 것 같다.')}}
// the legendary: only after the lighthouse is lit, at the end of the pier; it stays until caught
function legendTalk(){
  say('…주위의 색이 조금씩 빠져나가는 것 같다.',['동건','……'],'왕관의 보석들이 한꺼번에 빛난다!',()=>{SFX.enc();M.flashAt=T},{wait:0.6},
    ()=>startBattle([makeMon('donggun',20)],null,null,'탈색의 왕 동건이 모습을 드러냈다!'));
}

// ---------- main loop ----------
let last=0;
function frame(ts){
  const dt=Math.min(0.05,(ts-last)/1000||0);last=ts;T+=dt;
  if(toastT>0)toastT-=dt;
  netTick();
  if(scene==='title')updTitle();
  else{
    if(scene==='battle')updBattle(dt);
    if(EVO)EVO.t+=dt;
    if(UI.length)UI[UI.length-1].upd(dt);
    else if(Q.length)runQ(dt);
    else if(scene==='map')updMap(dt);
    else if(scene==='ending')updEnding();
  }
  ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
  if(scene==='title')drawTitle();else if(scene==='map')drawMap();else if(scene==='battle')drawBattle();else if(scene==='ending')drawEnding();
  if(EVO)drawEvo();
  const s=Q[0];if(s&&s.ty)dialogBox(s.name,s.ty);
  else if(s&&s.note){box(20,328,600,140);text(s.note+'.'.repeat((T*2|0)%4),40,352,22,DIM)}
  for(const u of UI)u.draw();
  if(toastT>0){ctx.globalAlpha=clamp(toastT*2,0,1);ctx.font=`700 18px ${FONT}`;const w=ctx.measureText(toastS).width+40;box(W/2-w/2,20,w,48);text(toastS,W/2,34,18,INK,'center');ctx.globalAlpha=1}
  pressed.clear();
  requestAnimationFrame(frame);
}
const SAVED=readSave();
requestAnimationFrame(frame);
playMusic('town');
</script>
